    const use = pi.k==='hex' || (canPay(T.p[seat],ABIL.dark[5].cost) && Math.random()<0.6);
    if(use){ const cand=T.p[tgt].dice.map((d,i)=>i).filter(i=>!T.p[tgt].dice[i].fz&&!T.p[tgt].dice[i].fzE); const pick=shuffle(cand).slice(0, pi.k==='hex'?pi.n:2);
      if(pi.k==='seal') pay(T.p[seat],ABIL.dark[5].cost);
      pick.forEach(i=>{ T.p[tgt].dice[i].f=1+rnd(6); }); bumpRoll(T.p[tgt],pick); lg(T,`{${seat}} ${pi.k==='hex'?'hexes':'uses Roll Seal on'} {${tgt}}'s roll.`); }
    advance(T); botCommit(T); return;
  }
}
function botStep(){
  botTimer=null;
  if(!S || S.mode!=='ai' || S.status!=='playing' || busy) return;
  const pi=pendingInput(S);
  if(pi){ if(pi.actor===BOT) botAnswer(pi); return; }
  if(S.turn!==BOT) return;
  const P=S.p[BOT];
  if(S.phase==='income' && S.step==='roll'){
    if(canCool(S,BOT) && (P.burn||0)>=2){ const T=clone(S), TP=T.p[BOT]; TP.res.W--; const b=TP.burn; TP.burn=Math.max(0,b-2); lg(T,`💧 {${BOT}} cools off: Burn ${b} → ${TP.burn}.`); sfx(T,'el','W'); botCommit(T); return; }
    const T=clone(S); doRoll(T); botCommit(T); return;
  }
  if(S.phase==='income'){
    const T=clone(S), TP=T.p[BOT]; TP.assign=TP.assign||{};
    TP.dice.forEach((d,i)=>{ const o=dieOptions(T,BOT,i); if(o.length>1 && !TP.assign[i]){ const tmp={...TP.res}; Object.values(TP.assign).forEach(k=>tmp[k]=(tmp[k]||0)+1); TP.assign[i]=o.slice().sort((a,b)=>(tmp[a]||0)-(tmp[b]||0))[0]; } });
    doCollect(T); botCommit(T); return;
  }
  if(S.phase==='main1' || S.phase==='main2'){
    const hi=botBestCard();
    if(hi>=0 && botPlay(hi)) return;
    const T=clone(S); nextPhase(T); botCommit(T); return;
  }
  if(S.phase==='combat'){
    const ai=botBestAbility();
    if(ai>=0 && botAbility(ai)) return;
    const fc=P.freeCard; if(fc!=null){ const hi=P.hand.lastIndexOf(fc); if(hi>=0 && !cardBlockReason(S,BOT,hi) && botPlay(hi)) return; }
    const T=clone(S); nextPhase(T); botCommit(T); return;
  }
}
function scheduleBot(){
  if(!S || S.mode!=='ai' || S.status!=='playing' || botTimer) return;
  const pi=pendingInput(S);
  if(pi ? pi.actor!==BOT : S.turn!==BOT) return;
  botTimer=setTimeout(botStep, pi ? 900 : 750);
}
function startAI(){
  const keys=Object.keys(HEROES);
  pickOne('Practice vs AI: choose the AI’s hero', [{v:'random',label:'🎲 Random'}].concat(keys.map(k=>({v:k,label:HEROES[k].name})))).then(h2=>{
    if(!h2) return;
    if(h2==='random') h2=keys[Math.floor(Math.random()*keys.length)];
    seenRoll={}; lastTurnKey=undefined; lastFlashN=undefined; lastPendOther=false; lastSxN=undefined; lastPhase=undefined;
    S=makeGame([pickedHero,h2],[null,null],'ai'); mySeat=0; render();
  });
}


/* =====================================================================
   BACKGROUND MUSIC — quiet fantasy loop, synthesised
   ===================================================================== */
let musicOn=true, musicTimer=null, musicGain=null, musicStep=0, musicNext=0;
try{ musicOn = localStorage.getItem('ewMusic')!=='off'; }catch(e){}
const PROG=[ [38,50,53,57], [34,46,50,53], [36,48,52,55], [33,45,48,52] ]; // Dm  Bb  C  Am — i VI VII v
const mtof = m => 440*Math.pow(2,(m-69)/12);
const BEAT=0.32;
function musicOut(ac){
  if(musicGain) return musicGain;
  musicGain=ac.createGain(); musicGain.gain.value=0.0001;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
  const comp=ac.createDynamicsCompressor(); comp.threshold.value=-24; comp.ratio.value=4;
  const dl=ac.createDelay(1.0); dl.delayTime.value=0.24; const fb=ac.createGain(); fb.gain.value=0.18;
  musicGain.connect(lp); lp.connect(comp); comp.connect(ac.destination); lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(comp);
  return musicGain;
}
function brass(ac,out,f,t,dur,v){ // swelling brass-like chord tone
  [0,-8,7].forEach(det=>{ const o=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=f; o.detune.value=det; lp.type='lowpass'; lp.frequency.setValueAtTime(500,t); lp.frequency.linearRampToValueAtTime(1300,t+dur*0.5); lp.frequency.linearRampToValueAtTime(700,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.5); g.gain.setValueAtTime(v,t+dur-0.4); g.gain.linearRampToValueAtTime(0.0001,t+dur);
    o.connect(lp); lp.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.05); });
}
function cello(ac,out,f,t,v){ // short driving string note
  const o=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=900;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+BEAT*0.9);
  o.connect(lp); lp.connect(g); g.connect(out); o.start(t); o.stop(t+BEAT);
}
function timpani(ac,out,t,v,f){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(f||80,t); o.frequency.exponentialRampToValueAtTime((f||80)*0.62,t+0.5);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.7); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.75); }
function hornNote(ac,out,f,t,dur,v){ const o=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter(); o.type='triangle'; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=1600;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.12); g.gain.setValueAtTime(v,t+dur-0.15); g.gain.linearRampToValueAtTime(0.0001,t+dur); o.connect(lp); lp.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.05); }
const MELODY=[ [62,2],[65,1],[64,1],[62,2],[60,2], [58,2],[57,1],[58,1],[60,4], [60,2],[62,1],[64,1],[65,2],[64,2], [62,3],[60,1],[57,4] ];
let melIdx=0, melLeft=0;
function musicTick(){
  const ac=actx(); if(!ac || !musicOn){ return; }
  const out=musicOut(ac);
  if(musicNext < ac.currentTime) musicNext = ac.currentTime+0.1;
  while(musicNext < ac.currentTime + 2.5){
    const bar=Math.floor(musicStep/8), chord=PROG[bar%PROG.length], i=musicStep%8, t=musicNext, section=Math.floor(bar/8)%2;
    if(i===0){ chord.slice(1).forEach(m=>brass(ac,out,mtof(m),t,BEAT*8,0.016)); }
    // driving ostinato: da-da-DUM
    const pat=[1,1,1,0,1,1,1,1][i]; if(pat) cello(ac,out,mtof(chord[0]+(i===2||i===6?12:0)),t,i===2||i===6?0.05:0.035);
    if(i===0 || i===4) timpani(ac,out,t,i===0?0.22:0.14, mtof(chord[0]-12+24));
    if(section===1 && i===7) timpani(ac,out,t,0.1,mtof(chord[0]+12));
    if(section===1){ if(melLeft<=0){ const [m,len]=MELODY[melIdx%MELODY.length]; melIdx++; melLeft=len*2; hornNote(ac,out,mtof(m),t,BEAT*len*2*0.95,0.03); } melLeft--; }
    musicStep++; musicNext += BEAT;
  }
}
function startMusic(){
  if(!musicOn) return; const ac=actx(); if(!ac) return;
  const out=musicOut(ac); out.gain.cancelScheduledValues(ac.currentTime); out.gain.setValueAtTime(Math.max(out.gain.value,0.0001),ac.currentTime); out.gain.linearRampToValueAtTime(0.32,ac.currentTime+2);
  if(!musicTimer){ musicTick(); musicTimer=setInterval(musicTick, 1000); }
}
function stopMusic(){
  const ac=actx(); if(musicGain && ac){ musicGain.gain.cancelScheduledValues(ac.currentTime); musicGain.gain.setValueAtTime(musicGain.gain.value,ac.currentTime); musicGain.gain.linearRampToValueAtTime(0.0001,ac.currentTime+0.8); }
  clearInterval(musicTimer); musicTimer=null;
}
/* browsers only allow audio after the first tap or key press */
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, function once(){ if(musicOn) startMusic(); document.removeEventListener(ev, once); }, {once:true}));

/* =====================================================================
   DOWNLOADABLE VERSION: browser-to-browser online play (PeerJS / WebRTC)
   These definitions replace the claude.ai storage versions above.
   ===================================================================== */
var peer=null, conn=null, isHost=false, roomCode=null, netState="idle", retryTimer=null, myName="";
try{ myName = localStorage.getItem('ewName') || ''; }catch(e){}
const PEER_PREFIX = 'elemental-wars-';

function seatLabel(seat){
  if(!S) return 'Player';
  const h=HEROES[S.heroes[seat]].name;
  if(S.mode==='local') return `P${seat+1} · ${h}`;
  if(S.mode==='ai') return seat===0 ? `You · ${h}` : `AI · ${h}`;
  const nm=(S.names && S.names[seat]) || `Player ${seat+1}`;
  return nm + (seat===mySeat ? ' (you)' : '');
}

/* Save locally, then send the whole state to the other player */
async function commit(T){
  const base = actionBefore ? actionBefore.ver : (S?S.ver:0);
  T.ver=(S&&S.ver||T.ver||0)+1; T.updatedAt=Date.now();
  if(T.undo) T.undo.ver=T.ver;
  S=T; render();
  if(T.mode==='online') sendState(base);
}
function sendState(base){
  if(conn && conn.open){ try{ conn.send({type:'state', S, base, host:isHost}); }catch(e){} }
  else toast('Not connected right now. Your move will sync when your friend reconnects.');
}
function onMsg(m){
  if(!m || typeof m!=='object') return;
  if(m.type==='hello' && isHost){
    if(!S){
      S=makeGame([pickedHero, HEROES[m.hero]?m.hero:'electro'], ['host','guest'], 'online', roomCode);
      S.names=[myName||'Player 1', String(m.name||'Player 2').slice(0,24)];
      seenRoll={}; lastTurnKey=undefined; lastFlashN=undefined; lastPendOther=false; lastSxN=undefined; lastPhase=undefined; mySeat=0;
      render();
    }
    conn.send({type:'state', S, base:S.ver, host:true});
    setNet('connected');
    return;
  }
  if(m.type==='full'){ toast('That game already has two players.'); leaveGame(); return; }
  if(m.type==='state' && m.S){
    const X=m.S;
    if(!S || (X.ver||0) > (S.ver||0)){ S=X; mySeat=isHost?0:1; setNet('connected'); render(); return; }
    if(X.ver===S.ver && X.updatedAt!==S.updatedAt){
      if(!isHost){ S=X; render(); toast('Your friend acted at the same moment, so your last move was cancelled. Try again.'); }
      else { conn.send({type:'state', S, base:S.ver, host:true}); }
    }
    return;
  }
}
function setNet(st){ netState=st; const el=$('#netbar'); if(el) el.outerHTML=netBar(); }
function netBar(){
  if(!S || S.mode!=='online') return '<div id="netbar"></div>';
  const txt = netState==='connected' ? '🟢 Connected' : netState==='lost' ? '🔴 Connection lost — trying to reconnect…' : '🟡 Connecting…';
  return `<div id="netbar" class="netbar ${netState}">${txt} · Game ${esc(roomCode||'')}</div>`;
}
function attach(c){
  conn=c;
  c.on('data', onMsg);
  c.on('open', ()=>{
    setNet('connected');
    if(!isHost) c.send({type:'hello', hero:pickedHero, name:myName||'Player 2'});
    else if(S) c.send({type:'state', S, base:S.ver, host:true});
  });
  c.on('close', ()=>{ if(conn===c){ setNet('lost'); if(!isHost) scheduleRetry(); } });
  c.on('error', ()=>{ if(conn===c){ setNet('lost'); if(!isHost) scheduleRetry(); } });
}
function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer=setTimeout(()=>{ if(!peer || peer.destroyed || isHost) return; try{ attach(peer.connect(PEER_PREFIX+roomCode,{reliable:true})); }catch(e){ scheduleRetry(); } }, 3000);
}
function peerReady(){
  if(typeof window.Peer!=='function'){
    lobbyMsg='Online play needs an internet connection (the connection library could not load). Pass & play still works.';
    renderLobby(); return false;
  }
  return true;
}
function saveName(){ const i=$('#namein'); if(i){ myName=i.value.trim().slice(0,24); try{ localStorage.setItem('ewName',myName); }catch(e){} } }

async function createOnline(){
  saveName(); if(!peerReady()) return;
  leaveGame(true);
  isHost=true; mySeat=0; roomCode=genCode(); S=null;
  peer=new Peer(PEER_PREFIX+roomCode);
  showHostWait();
  peer.on('connection', c=>{
    if(conn && conn.open){ c.on('open',()=>{ try{ c.send({type:'full'}); }catch(e){} setTimeout(()=>c.close(),300); }); return; }
    attach(c);
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on('error', e=>{
    if(e && e.type==='unavailable-id'){ try{ peer.destroy(); }catch(x){} createOnline(); return; }
    if(!S){ lobbyMsg='Could not start an online game: '+(e&&e.type||'error')+'. Check your internet connection.'; leaveGame(); }
    else setNet('lost');
  });
}
function showHostWait(){
  app().innerHTML=`<div class="lcard waitcard"><h2>Your game code</h2>
    <p class="bigcode">${esc(roomCode)}</p>
    <p>Send this code to your friend. They open the game, type the code under <b>Join</b>, and you're in.</p>
    <div class="lrow" style="justify-content:center"><button class="btn" data-act="copycode">Copy code</button><button class="btn ghost" data-act="lobby">Cancel</button></div>
    <p class="msub">Keep this page open while you wait.</p></div>`;
}
async function joinOnline(code){
  saveName(); if(!peerReady()) return;
  leaveGame(true);
  isHost=false; mySeat=1; roomCode=code; S=null; lastTurnKey=undefined; lastFlashN=undefined; lastPendOther=false; lastSxN=undefined; lastPhase=undefined; seenRoll={};
  app().innerHTML=`<p class="wait">Connecting to game ${esc(code)}…</p>`;
  peer=new Peer();
  peer.on('open', ()=>{ attach(peer.connect(PEER_PREFIX+code,{reliable:true})); });
  peer.on('error', e=>{
    if(e && e.type==='peer-unavailable'){
      if(S){ setNet('lost'); scheduleRetry(); return; }
      lobbyMsg='No game found with code '+code+'. Check the code and make sure your friend’s game page is still open.'; leaveGame(); return;
    }
    if(!S){ lobbyMsg='Could not connect: '+(e&&e.type||'error')+'.'; leaveGame(); } else setNet('lost');
  });
}
function openOnline(){ /* not used in the download */ }
function leaveGame(silent){
  clearTimeout(retryTimer);
  try{ if(conn) conn.close(); }catch(e){} conn=null;
  try{ if(peer) peer.destroy(); }catch(e){} peer=null;
  S=null; mySeat=null; netState='idle'; closeModal();
  document.body.classList.remove('turn-me','turn-opp','ingame');
  if(!silent) renderLobby();
}
async function renderLobby(){
  app().innerHTML = `
  <header class="lhero"><h1>Elemental Wars</h1><p>Two heroes, six dice, and a deck of elemental cards. Play a friend over the internet or on one device.</p></header>
  <section class="lcard"><h2>1. Pick your hero</h2>${heroPick()}<div class="lrow center"><button class="btn ghost" data-act="guide" data-h="${pickedHero}">📖 Check heroes, skills &amp; decks</button></div></section>
  <section class="lcard"><h2>2. Play</h2>
    <div class="lrow"><label for="namein" class="mlbl">Your name</label><input id="namein" class="namein" maxlength="24" value="${esc(myName)}" placeholder="Your name"></div>
    <div class="lrow"><button class="btn" data-act="create">Host online game</button>
      <span class="or">or join with a code</span><input id="codein" maxlength="6" placeholder="CODE" aria-label="Game code"><button class="btn ghost" data-act="joincode">Join</button></div>
    ${lobbyMsg?`<p class="msub warn">${esc(lobbyMsg)}</p>`:''}
    <p class="msub">Online play connects the two browsers directly. Both players need an internet connection and this same game file (or link).</p>
    <div class="lrow"><button class="btn ghost" data-act="local">Pass &amp; play on this device</button></div>
    <div class="lrow"><button class="btn ghost" data-act="ai">🤖 Practice vs AI</button></div>
    <div class="lrow"><button class="btn ghost soon" disabled aria-disabled="true">🤝 Co-op <span class="soontag">coming soon</span></button></div>
    <div class="lrow howrow"><button class="btn" data-act="rules">📜 How to play</button></div>
  </section>`;
  lobbyMsg='';
}
/* extra clicks for the download */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act="copycode"]'); if(!b) return;
  const t=roomCode||''; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Code copied')).catch(()=>toast('Code: '+t));
});
/* show the connection bar on the game screen */
const _render = render;
render = function(){ _render(); if(S && S.mode==='online'){ const top=document.querySelector('.gtop'); if(top && !document.getElementById('netbar')) top.insertAdjacentHTML('afterend', netBar()); } };
window.addEventListener('beforeunload', e=>{ if(S && S.mode==='online' && S.status==='playing'){ e.preventDefault(); e.returnValue=''; } });
renderLobby();

</script>
