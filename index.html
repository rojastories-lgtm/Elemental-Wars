<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#efe9ff; --ink:#1a1030; --muted:#5a4f7a; --panel:#fff; --line:#1a1030;
  --display:Bangers,Impact,"Arial Narrow Bold","Arial Black",sans-serif;
  --body:Fredoka,"Trebuchet MS","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#17122b; --ink:#f4f0ff; --muted:#b4a9d6; --panel:#241c40; }
}
:root[data-theme="dark"]{ --page:#17122b; --ink:#f4f0ff; --muted:#b4a9d6; --panel:#241c40; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--page); color:var(--ink); font-family:var(--body); font-weight:500; line-height:1.35; }
#app{ max-width:1280px; margin:0 auto; padding:14px 12px 60px; }
h1,h2,h3{ font-family:var(--display); font-weight:400; letter-spacing:.05em; }
.btn{ font:inherit; font-family:var(--display); letter-spacing:.05em; font-size:1.05rem; color:#1a1030; background:#ffc400; border:3px solid #1a1030; border-radius:99px; padding:4px 16px; min-height:44px; cursor:pointer; box-shadow:0 4px 0 #1a1030; }
.btn.ghost{ background:#fff; }
.btn.sm{ min-height:38px; font-size:.95rem; padding:2px 12px; }
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #1a1030; }
.btn:disabled{ opacity:.5; cursor:default; }
button:focus-visible,input:focus-visible{ outline:3px solid #ffc400; outline-offset:2px; }
.none{ color:var(--muted); font-size:.85rem; }
.lbl{ font-weight:700; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:#5a4f7a; margin-right:4px; }
.msub{ color:#5a4f7a; font-size:.88rem; margin:6px 0; }
.wait{ text-align:center; color:var(--muted); padding:40px; }

/* Pips & icons */
.pip{ width:24px; height:24px; display:inline-block; vertical-align:middle; }
.pip circle.ring{ stroke:#1a1030; stroke-width:6; fill:#fff; }
.pip .pg .el{ fill:#fff; stroke:#1a1030; stroke-width:7; stroke-linejoin:round; }
.pip .pg .dt{ display:none; }
.pip .pg .bold{ fill:none; stroke:#fff; stroke-width:10; stroke-linecap:round; }
.pip .pg .solid,.pip .pg .solid *{ fill:#fff; stroke:none; }
.pip text{ font-family:var(--display); font-size:58px; text-anchor:middle; dominant-baseline:central; fill:#1a1030; }
.ico{ display:inline-block; width:1.05em; height:1.05em; vertical-align:-.17em; }
.ico .el{ fill:#1a1030; stroke:none; } .ico .dt{ display:none; }
.ico .bold{ fill:none; stroke:#1a1030; stroke-width:9; stroke-linecap:round; } .ico .solid{ fill:#1a1030; }
.art2 path,.art2 polygon,.art2 circle,.art2 rect{ fill:none; stroke:#1a1030; stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; }
.art2 .el{ fill:#fff; } .art2 .bold{ stroke-width:4; }
.art2 .solid,.art2 .solid *{ fill:#1a1030; stroke:none; }
.art2 text{ font-family:var(--display); fill:#1a1030; stroke:none; text-anchor:middle; dominant-baseline:central; }
.art2 text.wt{ fill:#fff; }
.art2 .i-fire .el{ fill:#ff6a3d; } .art2 .i-water .el{ fill:#3da5ff; } .art2 .i-earth .el{ fill:#47c25a; }
.art2 .i-bolt .el{ fill:#ffd42a; } .art2 .i-snow .el{ fill:#bdf2ff; } .art2 .snowOut{ stroke-width:7; } .art2 .snowIn{ stroke:#fff; stroke-width:3.5; }
.art2 .i-dark .el{ fill:#8a4fff; } .art2 .i-steel .el{ fill:#b8c3d2; } .art2 .i-shield .el{ fill:#6cc0ff; } .art2 .i-heart .el{ fill:#ff8fb3; }
.art2 .i-card .el{ fill:#fff1c9; } .art2 .i-core .el{ fill:#c8d0e6; } .art2 .i-token .el{ fill:#d4b8ff; }
.art2 .i-star .el{ fill:#ffe066; } .art2 .i-cloud .el{ fill:#e6e6f5; }
.art2 .i-burst .el{ fill:#ffc93c; } .art2 .i-burstx .solid{ fill:#5a2bd0; }
.art2 .i-cycle .bold{ stroke:#7a3ff2; } .art2 .i-ban .bold{ stroke:#e0243b; } .art2 .i-slash .bold{ stroke:#e0243b; }
.art2 .i-arrowR .bold{ stroke:#1a1030; stroke-width:5; }
.cart .o{ stroke:#1a1030; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; }
.cart .thin{ stroke:#1a1030; stroke-width:1.2; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; }

/* Lobby */
.lhero{ text-align:center; padding:6px 0 4px; }
.lhero h1{ font-size:3rem; margin:0; color:#ffc400; text-shadow:3px 3px 0 #1a1030,-1px -1px 0 #1a1030,1px -1px 0 #1a1030,-1px 1px 0 #1a1030; }
.lhero p{ color:var(--muted); margin:4px 0 0; }
.lcard{ background:var(--panel); color:var(--ink); border:4px solid #1a1030; border-radius:18px; padding:12px 16px 16px; margin:16px auto; max-width:900px; box-shadow:0 6px 0 #1a1030; }
.lcard h2{ margin:2px 0 10px; font-size:1.6rem; }
.lcard h3{ margin:16px 0 6px; font-size:1.2rem; }
.heroes{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
.hpick{ border:0; border-radius:14px; padding:0; overflow:hidden; background:none; cursor:pointer; display:block; box-shadow:0 4px 0 rgba(0,0,0,.35); transition:transform .15s; }
.hpick:hover{ transform:translateY(-3px); }
.hcard{ display:block; width:100%; height:auto; }
.hpick:not(.on){ filter:saturate(.8) brightness(.92); }
.hpick svg{ display:block; width:100%; height:auto; }
.hpick span{ font-family:var(--display); font-size:1.2rem; letter-spacing:.05em; background:var(--c1); color:#fff; text-shadow:1px 1px 0 #1a1030,-1px -1px 0 #1a1030,1px -1px 0 #1a1030,-1px 1px 0 #1a1030; padding:4px; border-top:3px solid #1a1030; }
.hpick.on{ outline:5px solid #ffc400; outline-offset:3px; transform:translateY(-3px); }
.lrow{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:8px 0; }
.lrow input{ font:inherit; font-family:var(--display); letter-spacing:.2em; font-size:1.2rem; width:7.5em; min-height:44px; padding:4px 10px; border:3px solid #1a1030; border-radius:12px; text-transform:uppercase; background:#fff; color:#1a1030; }
.or{ color:var(--muted); font-size:.9rem; }
.glist{ display:flex; flex-direction:column; gap:6px; }
.gitem{ display:flex; justify-content:space-between; align-items:center; gap:10px; border:2px solid #1a1030; border-radius:12px; padding:6px 10px; background:#fff; color:#1a1030; }
.waitcard{ text-align:center; }
@media (max-width:640px){ .heroes{ grid-template-columns:1fr 1fr; gap:10px; } }

/* Game layout */
.gtop{ display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:10px; }
.gcode{ font-family:var(--display); font-size:1.3rem; letter-spacing:.06em; }
.phases{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex:1; justify-content:center; }
.ph{ font-family:var(--display); letter-spacing:.05em; padding:2px 10px; border:2px solid var(--ink); border-radius:99px; font-size:.95rem; opacity:.55; }
.ph.on{ background:#ffc400; color:#1a1030; border-color:#1a1030; opacity:1; }
.arr{ opacity:.5; }
.undo{ background:#7ee4ff; }
body.turn-me{ background:linear-gradient(180deg, var(--page) 55%, rgba(255,196,0,.22)); background-attachment:fixed; }
body.turn-opp{ background:linear-gradient(0deg, var(--page) 55%, rgba(255,63,164,.16)); background-attachment:fixed; }

.table{ display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:14px; align-items:start; }
@media (max-width:1000px){ .table{ grid-template-columns:1fr; } }
.field{ display:flex; flex-direction:column; gap:10px; min-width:0; }
.zone{ border-radius:20px; padding:6px; transition:opacity .2s; }
.zlabel{ font-family:var(--display); letter-spacing:.08em; font-size:.95rem; opacity:.75; margin:0 0 4px 6px; }
.zone:not(.acting) .ppanel{ opacity:.8; filter:saturate(.75); }
.zone.acting .ppanel{ animation:glow 1.8s ease-in-out infinite; }
@keyframes glow{ 0%,100%{ box-shadow:0 0 0 4px var(--c1),0 4px 0 4px #1a1030,0 0 14px 4px var(--c1); } 50%{ box-shadow:0 0 0 4px var(--c1),0 4px 0 4px #1a1030,0 0 30px 10px var(--c1); } }
@media (prefers-reduced-motion: reduce){ .zone.acting .ppanel{ animation:none; box-shadow:0 0 0 5px var(--c1),0 4px 0 5px #1a1030; } }
.midline{ display:flex; flex-direction:column; gap:8px; }
.turnbanner{ display:flex; align-items:center; justify-content:center; gap:14px; font-family:var(--display); font-size:2rem; letter-spacing:.08em; color:#fff; background:var(--tc); border:4px solid #1a1030; border-radius:16px; padding:4px 14px; text-shadow:2px 2px 0 #1a1030,-1.5px -1.5px 0 #1a1030,1.5px -1.5px 0 #1a1030,-1.5px 1.5px 0 #1a1030; box-shadow:0 5px 0 #1a1030; }
.turnbanner.opp{ font-size:1.5rem; filter:saturate(.85); }
.tphase{ font-size:.55em; background:#1a1030; border-radius:99px; padding:2px 10px; text-shadow:none; }
.tarrow{ font-size:.7em; }
.prompt{ border:3px solid #1a1030; border-radius:14px; background:#fff; color:#1a1030; padding:8px 12px; font-weight:600; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; box-shadow:0 4px 0 #1a1030; }
.prompt.you{ background:#fff3b0; }
.prompt.big{ font-family:var(--display); font-size:2rem; justify-content:center; background:#ffc400; }
.sect{ margin:12px 0 6px; font-size:1.25rem; }
.sect small{ font-family:var(--body); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-left:6px; }

.ppanel{ border:4px solid #1a1030; border-radius:16px; background:var(--c3); color:#1a1030; padding:10px; box-shadow:0 4px 0 #1a1030;
  display:grid; grid-template-columns:160px minmax(0,1fr) minmax(0,1.15fr); grid-template-areas:"port info res" "port dice dice" "cores cores cores"; gap:6px 14px; align-items:start; }
.pport{ grid-area:port; border:3px solid #1a1030; border-radius:12px; overflow:hidden; background:var(--c2); }
.pport svg,.pport img{ display:block; width:100%; height:auto; }
.pinfo{ grid-area:info; min-width:0; }
.pres{ grid-area:res; }
.pdice{ grid-area:dice; }
.pcores{ grid-area:cores; display:flex; flex-wrap:wrap; gap:6px; align-items:flex-start; }
.pname{ font-family:var(--display); font-size:1.35rem; letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hpbar{ position:relative; height:24px; border:3px solid #1a1030; border-radius:99px; background:#fff; overflow:hidden; margin:4px 0; }
.hpfill{ position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,#ff5a7a,#ff9db1); }
.hptxt{ position:relative; font-weight:700; font-size:.85rem; padding-left:8px; line-height:18px; }
.stat{ font-size:.8rem; font-weight:600; min-height:1em; }
.counts{ font-size:.78rem; color:#4a3f6b; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.backs{ display:inline-flex; }
.backs i{ width:14px; height:20px; border:2px solid #1a1030; border-radius:3px; background:repeating-linear-gradient(45deg,var(--c1) 0 3px,var(--c2) 3px 6px); margin-right:-5px; }
.tracks{ display:grid; grid-template-columns:1fr; gap:3px; }
.trk{ display:flex; align-items:center; gap:5px; }
.trk .pip{ width:22px; height:22px; flex:none; }
.cells{ display:grid; grid-template-columns:repeat(10,minmax(0,18px)); gap:3px; flex:1; }
.cells i{ aspect-ratio:1; border:1.5px solid #1a1030; border-radius:3px; background:#fff; max-height:18px; }
.cells i.on{ background:var(--cc); }
.trk b{ font-family:var(--display); font-weight:400; font-size:1.05rem; width:1.4em; text-align:right; }
.ppanel.theirs{ grid-template-areas:"port info res" "port dice dice" "cores cores cores"; }
@media (max-width:700px){
  .ppanel{ grid-template-columns:110px minmax(0,1fr); grid-template-areas:"port info" "res res" "dice dice" "cores cores"; }
  .ppanel.theirs{ grid-template-areas:"port info" "res res" "dice dice" "cores cores"; }
  .turnbanner{ font-size:1.5rem; } .turnbanner.opp{ font-size:1.2rem; }
  .phases{ display:none; }
}
.dicerow,.fogrow{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:2px 0; }
.die{ position:relative; display:inline-grid; place-items:center; width:44px; height:44px; border:3px solid #1a1030; border-radius:10px; background:#fff; box-shadow:0 3px 0 #1a1030; }
.die .pip{ width:30px; height:30px; }
.die .dn{ position:absolute; right:2px; bottom:0; font-size:.6rem; font-weight:700; }
.die .wmark{ position:absolute; left:2px; top:-2px; font-size:.7rem; color:#1a1030; }
.die.fz{ background:#d9f6ff; box-shadow:inset 0 0 0 3px #7ee4ff,0 3px 0 #1a1030; }
.die.fze{ background:#e6f0ff; box-shadow:inset 0 0 0 3px #2a8fe0,0 3px 0 #1a1030; }
.die.fog{ background:#e6e6f5; filter:grayscale(.6); }
.die.wildwait{ animation:wildpulse 1s ease-in-out infinite; background:#fff7cf; }
@keyframes wildpulse{ 0%,100%{ box-shadow:0 0 0 3px #ffc400,0 0 8px 2px #ffc400; transform:scale(1); } 50%{ box-shadow:0 0 0 5px #ffc400,0 0 22px 8px #ffde59; transform:scale(1.08); } }
.die.rolling{ animation:shake .7s ease-in-out; }
@keyframes shake{ 0%{ transform:rotate(0) translateY(0); } 20%{ transform:rotate(-18deg) translateY(-6px); } 40%{ transform:rotate(14deg) translateY(2px); } 60%{ transform:rotate(-10deg) translateY(-4px); } 80%{ transform:rotate(6deg); } 100%{ transform:rotate(0); } }
.die.landed{ animation:land .45s ease-out; }
@keyframes land{ 0%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
.die.flash{ outline:4px solid #ffc400; }
@media (prefers-reduced-motion: reduce){ .die.wildwait{ animation:none; box-shadow:0 0 0 4px #ffc400; } .die.rolling,.die.landed{ animation:none; } }
.wildpip{ filter:drop-shadow(0 0 0 #000); }
.wildhint{ font-weight:700; font-size:.85rem; background:#fff3b0; border:2px solid #1a1030; border-radius:10px; padding:3px 8px; display:inline-block; margin-top:4px; }
.dbtn{ padding:0; border:0; background:none; cursor:pointer; border-radius:12px; }
.core{ display:flex; flex-direction:column; gap:2px; width:160px; border:3px solid #1a1030; border-radius:10px; background:#fff; padding:4px 6px; font-size:.75rem; box-shadow:0 0 0 2px #ffc400; }
.core b{ font-family:var(--display); font-weight:400; font-size:.95rem; letter-spacing:.04em; }
.chp{ font-weight:700; color:#c2185b; }
.mini{ font:inherit; font-size:.75rem; font-weight:700; border:2px solid #1a1030; border-radius:8px; background:#ffc400; color:#1a1030; padding:3px 8px; min-height:32px; cursor:pointer; }

.abils{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:6px; }
.abil{ text-align:left; font:inherit; color:#1a1030; background:#fff; border:3px solid #1a1030; border-radius:12px; padding:6px 8px; display:grid; grid-template-columns:1fr auto; gap:2px 6px; cursor:pointer; box-shadow:0 3px 0 #1a1030; min-height:44px; }
.abil.sig{ background:linear-gradient(135deg,#fff3b0,#fff 70%); }
.abil.off{ opacity:.5; cursor:default; box-shadow:none; }
.abil.used{ opacity:.4; text-decoration:line-through; text-decoration-thickness:2px; }
.an{ font-family:var(--display); letter-spacing:.04em; font-size:1rem; }
.an em{ font-family:var(--body); font-style:normal; font-size:.6rem; font-weight:700; text-transform:uppercase; background:#ff3fa4; color:#fff; border-radius:99px; padding:1px 6px; }
.an em.usedtag{ background:#1a1030; }
.acost .pip{ width:20px; height:20px; }
.at{ grid-column:1 / -1; font-size:.75rem; font-weight:600; }

.hand{ display:flex; flex-wrap:wrap; gap:8px; }
.mcard{ position:relative; width:148px; text-align:left; font:inherit; color:#1a1030; background:var(--c3); border:3px solid #1a1030; border-radius:12px; padding:5px; display:flex; flex-direction:column; gap:3px; cursor:pointer; box-shadow:0 0 0 2px var(--c1),0 3px 0 2px #1a1030; }
.mcard.iscore{ box-shadow:0 0 0 2px #ffc400,0 3px 0 2px #1a1030; }
.mcard.off{ opacity:.55; cursor:default; }
.mhead{ font-family:var(--display); letter-spacing:.04em; font-size:.95rem; background:var(--c1); color:#fff; border:2px solid #1a1030; border-radius:7px; padding:1px 6px 0; text-shadow:1px 1px 0 #1a1030,-1px -1px 0 #1a1030,1px -1px 0 #1a1030,-1px 1px 0 #1a1030; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mcost{ display:flex; gap:2px; align-items:center; min-height:20px; }
.mcost .pip{ width:18px; height:18px; }
.mhp{ margin-left:auto; font-weight:700; font-size:.75rem; color:#c2185b; }
.martbox{ display:block; border:2px solid #1a1030; border-radius:7px; overflow:hidden; background:repeating-conic-gradient(from 0deg at 50% 62%, var(--c2) 0 7.5deg, var(--c2d) 7.5deg 15deg); }
.martbox svg{ display:block; width:100%; height:auto; }
.mtype{ font-family:var(--display); font-size:.8rem; letter-spacing:.05em; }
.mtext{ font-size:.72rem; font-weight:600; background:#fff; border:2px solid #1a1030; border-radius:7px; padding:3px 5px; min-height:3.2em; }
.why{ position:absolute; left:6px; right:6px; bottom:6px; background:#1a1030; color:#fff; font-size:.65rem; font-weight:700; border-radius:6px; padding:2px 5px; text-align:center; }
.fix{ margin-top:14px; border:2px dashed var(--muted); border-radius:12px; padding:6px 10px; }
.fix summary{ cursor:pointer; font-weight:700; min-height:28px; }
.fixrow{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:6px 0; font-size:.85rem; }

.logbox{ border:3px solid #1a1030; border-radius:14px; background:var(--panel); color:var(--ink); padding:6px 10px; max-height:80vh; overflow:auto; position:sticky; top:10px; }
@media (max-width:1000px){ .logbox{ position:static; max-height:320px; } }
.logbox ol{ list-style:none; margin:0; padding:0; font-size:.8rem; }
.logbox li{ padding:3px 0; border-bottom:1px dashed rgba(127,127,127,.35); }

/* Additions */
.shbar{ position:relative; height:22px; border:3px solid #1a1030; border-radius:99px; background:#eef6ff; overflow:hidden; margin:2px 0 4px; }
.shbar.empty{ opacity:.55; }
.shfill{ position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,#2f8fff,#8fd0ff); }
.shtxt{ position:relative; font-weight:700; font-size:.78rem; padding-left:8px; line-height:16px; }
.oppab{ margin-top:8px; border:3px solid #1a1030; border-radius:14px; background:var(--panel); color:var(--ink); padding:4px 10px 8px; }
.oppab summary{ font-family:var(--display); letter-spacing:.05em; font-size:1.05rem; cursor:pointer; min-height:30px; padding-top:4px; }
.abils.ro .abil{ cursor:default; box-shadow:none; opacity:.95; }
.abils.ro{ grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
.offinst{ margin-top:8px; }
.sellbtn{ margin-left:8px; font-size:.85rem; vertical-align:middle; }
.logbox li.blk{ background:rgba(47,143,255,.12); font-weight:600; border-radius:6px; padding-left:4px; }
.die.fog::after{ content:''; position:absolute; inset:-7px; border-radius:14px; pointer-events:none;
  background:radial-gradient(circle at 28% 38%, rgba(255,255,255,.97) 0 20%, transparent 21%), radial-gradient(circle at 62% 50%, rgba(225,225,245,.97) 0 25%, transparent 26%), radial-gradient(circle at 42% 72%, rgba(255,255,255,.95) 0 20%, transparent 21%), radial-gradient(circle at 78% 30%, rgba(235,235,250,.9) 0 16%, transparent 17%);
  animation:fogdrift 2.2s ease-in-out infinite; }
@keyframes fogdrift{ 0%,100%{ transform:translateX(-5px) scale(1); opacity:.85; } 50%{ transform:translateX(5px) scale(1.05); opacity:1; } }
.fogbtn,.fogchip{ animation:fogpulse 1.8s ease-in-out infinite; background:#e6e6f5; }
.fogchip{ display:inline-flex; align-items:center; gap:3px; border:2px solid #1a1030; border-radius:8px; padding:2px 6px; color:#1a1030; }
@keyframes fogpulse{ 0%,100%{ box-shadow:0 0 0 2px #c9c9e6; } 50%{ box-shadow:0 0 0 6px #e9e9f8; } }
@media (prefers-reduced-motion: reduce){ .die.fog::after,.fogbtn,.fogchip{ animation:none; } }
.myres,.blocking{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:#f3f0ff; border:2px solid #1a1030; border-radius:10px; padding:6px 8px; margin:6px 0; }
.blocking{ background:#fff3b0; }
.rchip{ display:inline-flex; align-items:center; gap:3px; background:#fff; border:2px solid #1a1030; border-radius:99px; padding:1px 7px 1px 2px; }
.rchip .pip{ width:20px; height:20px; }

function pip(sym){
  if(sym==='free') return `<svg class="pip" viewBox="0 0 100 100" aria-label="Free"><circle class="ring" cx="50" cy="50" r="44"/><path d="M24 76 L76 24" stroke="#1a1030" stroke-width="9" stroke-linecap="round" fill="none"/></svg>`;
  if(sym==='X')    return `<svg class="pip" viewBox="0 0 100 100" aria-label="X"><circle class="ring" cx="50" cy="50" r="44"/><text x="50" y="55">X</text></svg>`;
  return `<svg class="pip" viewBox="0 0 100 100" aria-label="${EL_NAME[sym]}"><circle class="ring" style="fill:${COL[sym]}" cx="50" cy="50" r="44"/><g class="pg" transform="translate(22 22) scale(.56)">${ICONS[EL[sym]]}</g><path d="M22 38 A30 30 0 0 1 42 20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".75"/></svg>`;
}
function inlineIcon(name){ return `<svg class="ico" viewBox="0 0 100 100" aria-label="${name}">${ICONS[name]}</svg>`; }
function richText(t){ return t.replace(/\{([FWELIDSVA])\}/g,(m,k)=>inlineIcon(EL[k])); }

const ARTICONS = {
  snow: '<path class="snowOut" d="M50 8 V92 M13 29 L87 71 M13 71 L87 29"/><path class="snowIn" d="M50 8 V92 M13 29 L87 71 M13 71 L87 29"/><circle class="el" cx="50" cy="50" r="13"/>'
};
function place(name,x,y,s,rot){ const k=s/100; return `<g class="i-${name}" transform="translate(${x-s/2} ${y-s/2}) scale(${k})"><g transform="rotate(${rot||0} 50 50)">${ARTICONS[name]||ICONS[name]}</g></g>`; }
function burst(x,y,s,label,inv){
  const pts=[], n=12, R=48, r=36;
  for(let i=0;i<n*2;i++){ const a=Math.PI*i/n-Math.PI/2, rad=i%2?r:R; pts.push((50+rad*Math.cos(a)).toFixed(1)+','+(50+rad*Math.sin(a)).toFixed(1)); }
  const fs=label.length>2?30:(label.length>1?34:40), k=s/100;
  return `<g class="${inv?'i-burstx':'i-burst'}" transform="translate(${x-s/2} ${y-s/2}) scale(${k})"><polygon class="${inv?'solid':'el'}" points="${pts.join(' ')}"/><text class="${inv?'wt':''}" x="50" y="53" font-size="${fs}">${label}</text></g>`;
}
function artSvg(items){
  const parts = items.map(it=>{
    const [name,x,y,s,label,rot]=it;
    if(name==='burst')  return burst(x,y,s,label,false);
    if(name==='burstx') return burst(x,y,s,label,true);
    if(name==='text')   return `<text x="${x}" y="${y}" font-size="${s}">${label}</text>`;
    return place(name,x,y,s,rot);
  }).join('');
  return `<svg class="art2" viewBox="0 0 200 110" role="img" aria-hidden="true">${parts}</svg>`;
}

const hasCore = (P,name) => P.cores.some(c=>CARDLIST[c.id].name===name);
function dieEl(S,seat,i){
  const P=S.p[seat], d=P.dice[i], H=heroEl(S,seat), a=P.assign&&P.assign[i];
  const base = d.f===1?'F':d.f===2?'W':d.f===3?'E':d.f===4?H:'A';
  if(S.heroes[seat]==='ice' && d.fz){ return a || 'I'; }
  if(base==='A') return a || 'A';
  return base;
}
function dieOptions(S,seat,i){
  const P=S.p[seat], d=P.dice[i], H=heroEl(S,seat);
  const base = d.f===1?'F':d.f===2?'W':d.f===3?'E':d.f===4?H:'A';
  if(S.heroes[seat]==='ice' && d.fz){ return base==='A' ? ['I','F','W','E'] : (base==='I'?['I']:['I',base]); }
  if(base==='A') return resKeys(S,seat);
  return [base];
}

/* ---------- Costs ---------- */
function canPay(P, cost, x){
  if(cost==='free') return true;
  const need={}; let any=0, X=0;
  cost.forEach(k=>{ if(k==='A') any++; else if(k==='X') X++; else need[k]=(need[k]||0)+1; });
  if(X) need.L=(need.L||0)+(x||1);
  for(const k in need){ if((P.res[k]||0)<need[k]) return false; }
  let left=0; for(const k in P.res){ left+=P.res[k]-(need[k]||0); }
  return left>=any;
}
function pay(P, cost, x){
  if(cost==='free') return;
  let any=0;
  cost.forEach(k=>{ if(k==='A') any++; else if(k==='X'){ P.res.L-=(x||1); } else P.res[k]--; });
  while(any-->0){ const k=Object.keys(P.res).sort((a,b)=>P.res[b]-P.res[a])[0]; P.res[k]--; }
}
const addRes = (P,k,n) => { P.res[k]=Math.min(MAXRES,(P.res[k]||0)+n); };

/* ---------- Game setup ---------- */
function makePlayer(hero){
  const grp=HEROES[hero].grp;
  const deck=shuffle(CARDLIST.map((c,i)=>i).filter(i=>!CARDLIST[i].token && (CARDLIST[i].grp==='gen'||CARDLIST[i].grp===grp)));
  const res={F:1,W:1,E:1}; res[HEROES[hero].el]=1;
  return {hp:START_HP, shield:0, res, dice:Array.from({length:6},()=>({f:1+rnd(6),fz:0,fzE:0,fog:0})),
    hand:deck.splice(0,HAND0), deck, disc:[], cores:[], fogPend:[], assign:{},
    st:{reflN:0, reflHalf:0, bulwark:0, energy:0, rime:0, fog:0, hex:0, used:[]}};
}
function makeGame(heroes, players, mode, code){
  const S={v:1, code:code||'LOCAL', mode, status:'playing', players, heroes, first:0, turn:0, tn:1, round:1,
    phase:'income', step:'roll', p:[makePlayer(heroes[0]),makePlayer(heroes[1])], q:[], log:[], winner:null, ver:0,
    createdAt:Date.now(), updatedAt:Date.now()};
  S.p[1].res[HEROES[heroes[1]].el]+=1;
  lg(S,'The game begins. {0} goes first.');
  return S;
}
function sfx(S,k,e){ S.sxN=(S.sxN||0)+1; S.sx=(S.sx||[]).concat([{n:S.sxN,k,e:e||null}]).slice(-10); }
function flash(S,t){ S.flN=(S.flN||0)+1; S.fl=(S.fl||[]).concat([{n:S.flN,t}]).slice(-6); }
function lg(S,m){ S.log.push(m); if(S.log.length>80) S.log.splice(0,S.log.length-80); }
function draw(S,seat,n){
  rolledFlag=true;
  const P=S.p[seat]; let got=[];
  for(let k=0;k<n;k++){
    if(!P.deck.length){ if(!P.disc.length) break; P.deck=shuffle(P.disc); P.disc=[]; lg(S,`{${seat}} reshuffles their discard pile.`); }
    const c=P.deck.shift(); P.hand.push(c); got.push(c);
  }
  return got;
}
function checkWin(S){
  const a=S.p[0].hp<=0, b=S.p[1].hp<=0;
  if(a||b){ S.status='over'; S.winner = a&&b ? -1 : (a?1:0); S.q=[]; lg(S, S.winner<0?'Both heroes fall. It is a draw!':`{${S.winner}} wins the game!`); }
}

/* ---------- Damage ---------- */
function destroyCore(S,seat,idx){
  const P=S.p[seat], core=P.cores[idx]; if(!core) return;
  P.cores.splice(idx,1); if(!CARDLIST[core.id].token) P.disc.push(core.id); const nm=CARDLIST[core.id].name;
  lg(S,`{${seat}}'s ${nm} is destroyed.`);
  if(nm==='Bolt Core'){ lg(S,`💥 Bolt Core explodes!`); heroDamage(S,1-seat,3,seat,'Bolt Core','S'); }
}
function damageCore(S,seat,idx,n,src,by,el){
  const P=S.p[seat], core=P.cores[idx]; if(!core||n<=0) return;
  const nm=CARDLIST[core.id].name;
  if(core.prot && core.prot>=S.tn){ lg(S,`🛡 Stone Skin protects {${seat}}'s ${nm}.`); flash(S,`🛡 Stone Skin protects ${nm}!`); return; }
  if(by!==seat && hasCore(P,'Earthen Bulwark') && !P.st.bulwark){ n--; P.st.bulwark=1; lg(S,`🛡 Earthen Bulwark blocks 1 damage to {${seat}}'s ${nm}.`); flash(S,`🛡 Earthen Bulwark blocked 1 damage!`); }
  if(by!==seat && nm!=='Rebar Core' && hasCore(P,'Rebar Core') && n>0){ n--; lg(S,`🛡 Rebar Core blocks 1 damage.`); flash(S,`🛡 Rebar Core blocked 1 damage!`); }
  if(n<=0) return;
  core.hp-=n; if(by===seat && core.hp<1){ core.hp=1; }
  sfx(S,'glass',el); lg(S,`${src||'Damage'} hits {${seat}}'s ${nm} for ${n}.`);
  if(core.hp<=0 && P.st.ironWill===S.tn){ core.hp=1; lg(S,`Iron Will keeps ${nm} standing at 1.`); flash(S,`Iron Will keeps ${nm} standing!`); }
  if(hasCore(P,'Anvil Core')){ lg(S,`Anvil Core rings out.`); heroDamage(S,1-seat,1,seat,'Anvil Core','S'); }
  if(core.hp<=0) destroyCore(S,seat,P.cores.indexOf(core));
}
function healCore(S,seat,core,n){
  const max=core.max||CARDLIST[core.id].hp, before=core.hp; core.hp=Math.min(max,core.hp+n); return core.hp-before;
}
function coresHealed(S,seat){
  if(hasCore(S.p[seat],'Furnace Core')){ lg(S,`🔥 Furnace Core flares.`); heroDamage(S,1-seat,1,seat,'Furnace Core','F'); }
}
function heroDamage(S,seat,n,from,src,el){
  const P=S.p[seat]; if(n<=0) return;
  if(hasCore(P,'Glacier Core')){ const fz=P.dice.filter(d=>d.fz).length; if(fz){ const r=Math.min(n,fz); n-=r; lg(S,`🛡 Glacier Core blocks ${r}.`); flash(S,`🛡 Glacier Core blocked ${r} damage!`); } }
  if(n>0 && hasCore(P,'Earthen Bulwark') && !P.st.bulwark){ n--; P.st.bulwark=1; lg(S,`🛡 Earthen Bulwark blocks 1 damage (${src||'damage'}) for {${seat}}.`); flash(S,`🛡 Earthen Bulwark blocked 1 damage from ${src||'an attack'}!`); }
  let refl=0;
  if(n>0 && P.st.reflN>0){ const r=Math.min(n,P.st.reflN); P.st.reflN-=r; n-=r; refl+=r; }
  if(n>0 && P.st.reflHalf){ const r=Math.floor(n/2); n-=r; refl+=r; P.st.reflHalf=0; }
  const s=Math.min(P.shield,n); P.shield-=s; n-=s;
  if(s) lg(S,`{${seat}}'s shield absorbs ${s}.`);
  if(n>0){ P.hp-=n; sfx(S,'dmg',el); lg(S,`${src||'Damage'}: {${seat}} takes ${n} damage.`); }
  if(refl>0 && from!=null && from!==seat){ S.p[from].hp-=refl; sfx(S,'dmg'); lg(S,`{${seat}} reflects ${refl} damage back.`); }
  checkWin(S);
}
function staticFieldPing(S,seat){
  if(hasCore(S.p[seat],'Static Field')){ lg(S,`Static Field zaps!`); heroDamage(S,1-seat,2,seat,'Static Field','L'); }
}
function drainFrom(S,seat,els,keep){
  const E=S.p[1-seat], P=S.p[seat]; const got=[];
  els.forEach(k=>{ if(E.res[k]>0){ E.res[k]--; got.push(k); } });
  if(got.length){
    lg(S,`{${seat}} drains ${got.map(k=>EL_NAME[k]).join(', ')} from {${1-seat}}.`);
    for(let i=0;i<Math.min(keep||0,got.length);i++){ if(P.res[got[i]]!==undefined) addRes(P,got[i],1); else addRes(P,Object.keys(P.res).sort((a,b)=>P.res[a]-P.res[b])[0],1); }
    if(hasCore(P,'Leech Core') && P.hp<START_HP){ P.hp=Math.min(START_HP,P.hp+1); lg(S,`Leech Core heals {${seat}} 1.`); }
    if(hasCore(P,'Void Maw Core')){ lg(S,`Void Maw Core bites for ${got.length}.`); heroDamage(S,1-seat,got.length,seat,'Void Maw Core','D'); }
  }
}
function autoDrainEls(S,seat,n){ // pick enemy's largest piles
  const E=S.p[1-seat], r={...E.res}, out=[];
  for(let i=0;i<n;i++){ const k=Object.keys(r).sort((a,b)=>r[b]-r[a])[0]; if(r[k]>0){ out.push(k); r[k]--; } }
  return out;
}

/* ---------- Step engine ---------- */
const INPUT = {defend:1, respond:1, lose:1, hex:1, seal:1};
function expand(S, seat, fx, ctx, el, src){
  const steps=[]; let pk=null;
  fx.forEach(op=>{
    if(op[0]==='dmg'){
      if(!pk){ pk={k:'packet', from:seat, unb:0, blk:0, el, src, tgt:ctx.tgt||null, fire:ctx.fire}; steps.push(pk); }
      if(op[2]&&op[2].unb) pk.unb+=op[1]; else pk.blk+=op[1];
    } else steps.push({k:'op', seat, op, ctx, el, src});
  });
  if(ctx.ember!=null && pk){ pk.blk+=1; steps.unshift({k:'op',seat,op:['unfreezeIdx'],ctx,el,src}); }
  if(ctx.forge!=null && pk){ pk.blk+=2; pk.piston=1; steps.unshift({k:'op',seat,op:['selfHitIdx',1],ctx,el,src}); }
  if(pk && fx.some(o=>o[0]==='selfCoreDmg')) pk.piston=1;
  return steps;
}
function advance(S){
  let guard=0;
  while(S.q.length && guard++<300 && S.status==='playing'){
    const st=S.q[0];
    if(INPUT[st.k]) return;
    S.q.shift();
    runStep(S,st);
  }
}
function runStep(S,st){
  if(st.k==='packet') return runPacket(S,st);
  if(st.k==='op') return runOp(S,st);
  if(st.k==='ping') return staticFieldPing(S,st.seat);
}
function runPacket(S,pk){
  const A=S.p[pk.from];
  if(pk.fire && hasCore(A,'Blaze Core') && !pk.bz){ pk.bz=1; if(pk.blk>0) pk.blk++; else pk.unb++; lg(S,`🔥 Blaze Core adds +1 damage.`); }
  if(pk.el==='L' && hasCore(A,'Arc Battery') && !pk.ab){ pk.ab=1; if(pk.blk>0) pk.blk++; else pk.unb++; lg(S,`⚡ Arc Battery adds +1 damage.`); }
  if(pk.piston && hasCore(A,'Piston Core') && !pk.ps){ pk.ps=1; if(pk.blk>0) pk.blk++; else pk.unb++; lg(S,`Piston Core adds +1 damage.`); }
  const tot=pk.blk+pk.unb; if(tot<=0) return;
  const t=pk.tgt||{seat:1-pk.from, core:-1};
  if(t.core<0 && !pk.pc && hasCore(A,'Piercing Core') && !A.st.pierce){ pk.pc=1; A.st.pierce=1; if(pk.unb<1 && pk.blk>0){ pk.blk--; pk.unb++; lg(S,`Piercing Core makes 1 damage unblockable.`); } }
  if(t.core>=0){ damageCore(S,t.seat,t.core,tot,pk.src,pk.from,pk.el); return; }
  if(pk.blk>0 && !pk.done && defendable(S,t.seat,pk)){
    S.q.unshift({k:'defend', actor:t.seat, pk}); return;
  }
  heroDamage(S,t.seat, pk.unb + Math.max(0,pk.blk-(pk.blocked||0)), pk.from, pk.src, pk.el);
}
function defendable(S,seat,pk){
  const P=S.p[seat];
  if(totalRes(P)>0) return true;
  if(P.hand.some(i=>DEFEND_OK.has(CARDLIST[i].name))) return true;
  if(hasCore(P,'Water Stone')) return true;
  return false;
}
function runOp(S,st){
  const {seat,op,ctx}=st, P=S.p[seat], E=S.p[1-seat];
  switch(op[0]){
    case 'heal': { const n=op[1]; P.hp=Math.min(START_HP,P.hp+n); lg(S,`{${seat}} heals ${n}.`); break; }
    case 'shield': { let n=op[1]; if(op[2]==='frozen' && P.dice.some(d=>d.fz)) n++; if(op[2]==='burning' && (E.burn||0)>0) n++; P.shield+=n; lg(S,`{${seat}} gains ${n} shield.`); break; }
    case 'draw': { const g=draw(S,seat,op[1]); lg(S,`{${seat}} draws ${g.length} card${g.length===1?'':'s'}.`); break; }
    case 'gain': addRes(P,op[1],op[2]); lg(S,`{${seat}} gains ${op[2]} ${EL_NAME[op[1]]}.`); break;
    case 'gainChoice': (ctx.gain||[]).forEach(k=>addRes(P,k,1)); lg(S,`{${seat}} gains ${(ctx.gain||[]).map(k=>EL_NAME[k]).join(', ')}.`); break;
    case 'drain': drainFrom(S,seat, ctx.drain||autoDrainEls(S,seat,op[1]), op[2]); break;
    case 'lose': {
      const keys=Object.keys(E.res).filter(k=>E.res[k]>0);
      if(!keys.length) break;
      if(keys.length===1){ E.res[keys[0]]--; lg(S,`{${1-seat}} loses 1 ${EL_NAME[keys[0]]}.`); break; }
      S.q.unshift({k:'lose', actor:1-seat, n:op[1]}); break;
    }
    case 'coreAll': {
      const seats = op[2]==='all' ? [1-seat,seat] : [1-seat];
      seats.forEach(s=>{ for(let i=S.p[s].cores.length-1;i>=0;i--) damageCore(S,s,i,op[1],st.src,seat); });
      break;
    }
    case 'freezeOwn': (ctx.freeze||[]).forEach(i=>{ P.dice[i].fz=1; }); if((ctx.freeze||[]).length) lg(S,`{${seat}} freezes ${ctx.freeze.length} of their dice.`); break;
    case 'freezeEnemy': (ctx.efreeze||[]).forEach(i=>{ E.dice[i].fzE=1; }); if((ctx.efreeze||[]).length) lg(S,`{${seat}} freezes ${ctx.efreeze.length} of {${1-seat}}'s dice.`); break;
    case 'unfreezeIdx': if(ctx.ember!=null && P.dice[ctx.ember]){ P.dice[ctx.ember].fz=0; lg(S,`{${seat}} unfreezes a die for +1 damage.`); } break;
    case 'unfreezeOne': if(ctx.die!=null && P.dice[ctx.die]){ P.dice[ctx.die].fz=0; lg(S,`{${seat}} unfreezes a die.`); } break;
    case 'thawBurst': {
      const n=P.dice.filter(d=>d.fz).length; P.dice.forEach(d=>d.fz=0);
      lg(S,`{${seat}} unfreezes ${n} dice.`);
      S.q.unshift({k:'packet', from:seat, unb:0, blk:n+1, el:'F', src:st.src, tgt:ctx.tgt||null, fire:ctx.fire});
      break;
    }
    case 'thawGain': { const n=P.dice.filter(d=>d.fz).length; P.dice.forEach(d=>d.fz=0); addRes(P,'F',n); lg(S,`{${seat}} unfreezes ${n} dice and gains ${n} Fire.`); break; }
    case 'dmgX': {
      let n = op[1]==='unspent' ? totalRes(P) : op[1]==='frozen' ? P.dice.filter(d=>d.fz).length : op[1]==='efrozen' ? E.dice.filter(d=>d.fzE).length : (ctx.x||0);
      n=Math.min(op[2],n)+(op[3]||0);
      if(n>0) S.q.unshift({k:'packet', from:seat, unb:0, blk:n, el:st.el, src:st.src, tgt:ctx.tgt||null, fire:ctx.fire});
      break;
    }
    case 'drawInstantDmg': {
      const g=draw(S,seat,1); const c=g.length?CARDLIST[g[0]]:null;
      lg(S,`{${seat}} draws a card${c&&c.type==='Instant'?` — an instant (${c.name})!`:'.'}`);
      if(c && c.type==='Instant') S.q.unshift({k:'packet', from:seat, unb:0, blk:op[1], el:'L', src:st.src, tgt:ctx.tgt||null, fire:ctx.fire});
      break;
    }
    case 'selfCoreDmg': if(ctx.ownCore!=null && P.cores[ctx.ownCore]) damageCore(S,seat,ctx.ownCore,op[1],st.src,seat); break;
    case 'selfHitIdx': if(ctx.forge!=null && P.cores[ctx.forge]) damageCore(S,seat,ctx.forge,op[1],st.src,seat); break;
    case 'healCore': { const c=P.cores[ctx.healCore!=null?ctx.healCore:-1]; if(c){ const h=healCore(S,seat,c,op[1]); lg(S,`{${seat}} repairs ${CARDLIST[c.id].name} (+${h}).`); if(h>0) coresHealed(S,seat); } break; }
    case 'healCores': { let tot=0; P.cores.forEach(c=>tot+=healCore(S,seat,c,op[1])); if(P.cores.length) lg(S,`{${seat}} repairs their cores (+${tot}).`); if(tot>0) coresHealed(S,seat); break; }
    case 'scrap': { const c=P.cores[ctx.ownCore]; if(!c) break; const hp=Math.max(0,c.hp); lg(S,`{${seat}} scraps ${CARDLIST[c.id].name}!`); destroyCore(S,seat,ctx.ownCore); S.q.unshift({k:'packet', from:seat, unb:0, blk:hp+op[1], el:'S', src:st.src, tgt:ctx.tgt||null, fire:ctx.fire, piston:1}); break; }
    case 'tempest': { const n=P.cores.length; if(n) S.q.unshift({k:'packet', from:seat, unb:0, blk:2*n, el:'S', src:st.src, tgt:ctx.tgt||null, fire:ctx.fire, piston:1}); break; }
    case 'reforge': { if(ctx.discCore!=null && P.cores.length<maxCores(S,seat)){ const di=P.disc.indexOf(ctx.discCore); if(di>=0){ P.disc.splice(di,1); const mx=CARDLIST[ctx.discCore].hp; P.cores.push({id:ctx.discCore,hp:op[1]==='full'?mx:2,prot:0,max:mx}); lg(S,`{${seat}} reforges ${CARDLIST[ctx.discCore].name}.`); } } break; }
    case 'eclipse': {
      if(!E.hand.length){ lg(S,`{${1-seat}} has no cards to steal.`); break; }
      const id=E.hand.splice(rnd(E.hand.length),1)[0]; P.hand.push(id); P.freeCard=id;
      lg(S,`🌑 {${seat}} steals ${CARDLIST[id].name} from {${1-seat}}!`); flash(S,`🌑 Eclipse steals ${CARDLIST[id].name}!`); break;
    }
    case 'burn': addBurn(S,1-seat,op[1],seat); break;
    case 'burnIf': addBurn(S,1-seat,(E.burn||0)>0?2:1,seat); break;
    case 'burnDouble': { const b=E.burn||0; E.burn=Math.min(BURN_MAX,b*2); lg(S,`🔥 {${1-seat}}'s Burn doubles to ${E.burn}!`); if(E.burn>b) flash(S,`🔥 Burn doubled to ${E.burn}!`); break; }
    case 'dmgBurn': { const n=Math.min(op[1],E.burn||0); if(n>0) S.q.unshift({k:'packet', from:seat, unb:0, blk:n, el:'V', src:st.src, tgt:ctx.tgt||null, fire:ctx.fire}); else lg(S,`{${1-seat}} isn't burning.`); break; }
    case 'drawIfBurn': if((E.burn||0)>0){ const g=draw(S,seat,1); lg(S,`{${seat}} draws ${g.length}.`); } break;
    case 'ashCloud': E.st.noCool=S.tn+1; lg(S,`🌫 Ash Cloud: {${1-seat}} can't cool their Burn with water until their next turn ends.`); flash(S,`🌫 Water can’t cool Burn for now!`); break;
    case 'burnTickNow': burnTick(S,1-seat,false); break;
    case 'falseCore': { if(P.cores.length<maxCores(S,seat)){ const id=CI['False Core']; P.cores.push({id,hp:2,prot:0,max:2}); lg(S,`{${seat}} forges a False Core.`); } else lg(S,`{${seat}} has no room for another core.`); break; }
    case 'burnAmp': addBurn(S,1-seat, op[1]+Math.floor((E.burn||0)/op[2]), seat); break;
    case 'burnHalf': { const b=E.burn||0; let n=op[1]==='ceil'?Math.ceil(b/2):Math.floor(b/2); n=Math.max(op[2],Math.min(op[3],n)); addBurn(S,1-seat,n,seat); break; }
    case 'selfHurt': P.hp-=op[1]; lg(S,`{${seat}} loses ${op[1]} health.`); sfx(S,'dmg'); checkWin(S); break;
    case 'mindRot': { if(!E.hand.length){ lg(S,`{${1-seat}} has no cards.`); break; } const id=E.hand.splice(rnd(E.hand.length),1)[0]; E.disc.push(id); lg(S,`🌑 {${1-seat}} discards ${CARDLIST[id].name}.`); flash(S,`🌑 Mind Rot: ${CARDLIST[id].name} discarded`); break; }
    case 'shieldPerCore': { const n=P.cores.length; if(n){ P.shield+=n; lg(S,`{${seat}} gains ${n} shield.`); } break; }
    case 'ironWill': P.st.ironWill=S.tn; lg(S,`{${seat}}'s cores can't be destroyed this turn.`); break;
    case 'reflectN': P.st.reflN+=op[1]; lg(S,`{${seat}} will reflect the next ${op[1]} damage.`); break;
    case 'reflectHalf': P.st.reflHalf=1; lg(S,`{${seat}} gains a reflecting shield.`); break;
    case 'protectCore': if(ctx.core!=null && P.cores[ctx.core]){ P.cores[ctx.core].prot=S.tn+1; lg(S,`{${seat}} protects ${CARDLIST[P.cores[ctx.core].id].name}.`); } break;
    case 'reroll': (ctx.dice||[]).forEach(i=>{ P.dice[i].f=1+rnd(6); }); bumpRoll(P,ctx.dice||[]); lg(S,`{${seat}} rerolls ${(ctx.dice||[]).length} die.`); break;
    case 'flip': (ctx.dice||[]).forEach(i=>{ P.dice[i].f=7-P.dice[i].f; }); bumpRoll(P,ctx.dice||[]); lg(S,`{${seat}} flips ${(ctx.dice||[]).length} dice.`); break;
    case 'setDie': (ctx.dice||[]).forEach(i=>{ P.dice[i].f=ctx.face||P.dice[i].f; }); bumpRoll(P,ctx.dice||[]); lg(S,`{${seat}} sets a die.`); break;
    case 'fog': E.st.fog+=op[1]; lg(S,`{${seat}} sends fog: one of {${1-seat}}'s dice will be fogged next roll.`); break;
    case 'hex': P.st.hex+=op[1]; lg(S,`{${seat}} hexes {${1-seat}}'s next roll.`); break;
    case 'discard': (ctx.discard||[]).sort((a,b)=>b-a).forEach(hi=>{ const id=P.hand.splice(hi,1)[0]; if(id!=null) P.disc.push(id); }); lg(S,`{${seat}} discards a card.`); break;
  }
}

/* ---------- Turn flow ---------- */
function addBurn(S,seat,n,by){
  if(by!=null && hasCore(S.p[by],'Smoldering Core')) n+=1;
  const P=S.p[seat], before=P.burn||0; P.burn=Math.min(BURN_MAX,before+n);
  if(P.burn>before){ lg(S,`🔥 {${seat}} gets ${P.burn-before} Burn (now ${P.burn}).`); sfx(S,'el','V'); }
}
function burnTick(S,seat,grow){
  const P=S.p[seat], E=S.p[1-seat], b=P.burn||0; if(b<=0) return;
  const dmg=b+(hasCore(E,'Molten Core')?1:0);
  lg(S,`🔥 Burn scorches {${seat}} for ${dmg}.`); flash(S,`🔥 Burn deals ${dmg} damage!`);
  heroDamage(S,seat,dmg,1-seat,'Burn','V');
  if(grow && S.status==='playing'){ P.burn = hasCore(E,'Volcano Core') ? Math.max(0,b-1) : Math.floor(b/2); lg(S,`🔥 {${seat}}'s Burn ${hasCore(E,'Volcano Core')?'drops':'halves'} to ${P.burn}.`); }
}
function doRoll(S){
  const seat=S.turn, P=S.p[seat], E=S.p[1-seat];
  burnTick(S,seat,true);
  if(S.status!=='playing') return;
  if(hasCore(P,'Magma Pool Core')) addBurn(S,1-seat,1,seat);
  const g=draw(S,seat,1);
  const rolled=[]; P.dice.forEach((d,i)=>{ if(!d.fz && !d.fzE){ d.f=1+rnd(6); rolled.push(i); } d.fog=0; }); bumpRoll(P,rolled);
  if(P.st.fog>0){ const cand=P.dice.map((d,i)=>i).filter(i=>!P.dice[i].fz); shuffle(cand).slice(0,P.st.fog).forEach(i=>P.dice[i].fog=1); lg(S,`Fog settles on {${seat}}'s dice.`); P.st.fog=0; }
  P.assign={}; S.step='adjust';
  lg(S,`{${seat}} draws ${g.length} and rolls the dice.`);
  if(hasCore(P,'Gearwork Core') && P.cores.length){ let tot=0; P.cores.forEach(c=>tot+=healCore(S,seat,c,1)); lg(S,`Gearwork Core repairs {${seat}}'s cores (+${tot}).`); if(tot>0) coresHealed(S,seat); }
  if(E.st.hex>0){ S.q.push({k:'hex', actor:1-seat, n:E.st.hex}); E.st.hex=0; }
  const seal=ABIL.dark[5];
  if(S.heroes[1-seat]==='dark' && canPay(E,seal.cost)) S.q.push({k:'seal', actor:1-seat});
  advance(S);
}
function doCollect(S){
  const seat=S.turn, P=S.p[seat], E=S.p[1-seat];
  const gained=[];
  P.dice.forEach((d,i)=>{ let k=dieEl(S,seat,i); if(k==='A') k=heroEl(S,seat); if(d.fog){ P.fogPend.push(k); } else { addRes(P,k,1); gained.push(k); } });
  lg(S,`{${seat}} collects ${gained.length} resources${P.fogPend.length?` (${P.fogPend.length} fogged)`:''}.`);
  if(hasCore(P,'Frozen Heart')){ const fz=P.dice.filter(d=>d.fz).length; if(fz){ P.shield+=fz; lg(S,`❄ Frozen Heart grants ${fz} shield.`); } }
  if(hasCore(P,'Capacitor Core')){ addRes(P,'L',1); lg(S,`Capacitor Core adds 1 Lightning.`); }
  if(hasCore(P,'Hollow Core')) drainFrom(S,seat,autoDrainEls(S,seat,1),0);
  P.dice.forEach(d=>{ d.fzE=0; d.fog=0; });
  P.assign={}; S.phase='main1'; S.step=null;
}
const PHASES=['income','main1','combat','main2'];
const PHASE_NAME={income:'Income', main1:'Main 1', combat:'Combat', main2:'Main 2'};
function nextPhase(S){
  const i=PHASES.indexOf(S.phase);
  if(S.phase==='main2') return endTurn(S);
  S.phase=PHASES[i+1]; lg(S,`{${S.turn}} moves to ${PHASE_NAME[S.phase]}.`);
}
function endTurn(S){
  const seat=S.turn, P=S.p[seat];
  if(hasCore(P,'Spring Core') && P.hp<START_HP){ P.hp=Math.min(START_HP,P.hp+1); lg(S,`Spring Core heals {${seat}} 1.`); }
  P.fogPend=[]; P.st.energy=0; P.st.rime=0; P.st.used=[]; P.freeCard=null;
  S.turn=1-seat; S.tn++;
  S.p.forEach(x=>x.st.pierce=0);
  if(S.turn===S.first){ S.round++; S.p.forEach(x=>x.st.bulwark=0); }
  S.phase='income'; S.step='roll';
  lg(S,`— {${S.turn}}'s turn (round ${S.round}) —`);
}

/* ---------- Legality ---------- */
const isMyTurnFree = (S,seat) => S.status==='playing' && S.turn===seat && !pendingInput(S);
function pendingInput(S){ return S.q.length && INPUT[S.q[0].k] ? S.q[0] : null; }
function canCool(S,seat){ const P=S.p[seat]; return S.status==='playing' && S.turn===seat && !pendingInput(S) && (P.burn||0)>0 && (P.res.W||0)>=1 && !(P.st.noCool && P.st.noCool>=S.tn); }
function cardBlockReason(S,seat,hi){
  const P=S.p[seat], c=CARDLIST[P.hand[hi]], n=c.name, mine=S.turn===seat, free=P.freeCard===P.hand[hi] && mine;
  if(S.status!=='playing') return 'Game over';
  if(pendingInput(S)) return 'Waiting for a decision';
  if(DEFEND_ONLY.has(n)) return 'Use when defending';
  if(NEGATORS.has(n)) return 'Use when the enemy plays a card';
  if(!mine){ if(c.type!=='Instant') return 'Only instants on their turn'; }
  else {
    if(S.phase==='income' && S.step==='roll' && c.type!=='Instant') return 'Roll first';
    if(DICE_CARDS.has(n)){ if(!(S.phase==='income'&&S.step==='adjust')) return 'Play before collecting dice'; }
    else if(S.phase==='income' && c.type!=='Instant') return 'Collect your dice first';
    if(c.type!=='Instant' && !DICE_CARDS.has(n) && !['main1','main2'].includes(S.phase) && !(free && S.phase==='combat')) return 'Play in a main phase';
  }
  if(isCoreCard(c) && P.cores.length>=maxCores(S,seat)) return `You already have ${maxCores(S,seat)} cores`;
  if(free){}
  else if(n==='Fast Shot'){ if((P.res.L||0)<1) return 'Need Lightning'; }
  else if(!canPay(P,c.cost)) return 'Not enough resources';
  if(n==='Shatter' && !P.dice.some(d=>d.fz)) return 'No frozen die';
  if(n==='Stone Skin' && !P.cores.length) return 'No core to protect';
  if(n==='Black Market' && P.hand.length<2) return 'No card to discard';
  if((n==='Weld'||n==='Shrapnel') && !P.cores.length) return 'You need a core';
  if((n==='Reforge'||n==='Rebuild') && (!P.disc.some(i=>isCoreCard(CARDLIST[i])) || P.cores.length>=maxCores(S,seat))) return 'No core to reforge';
  return null;
}
function abilBlockReason(S,seat,ai){
  const a=ABIL[S.heroes[seat]][ai], P=S.p[seat];
  if(a.enemyTurn) return 'Enemy turn only';
  if(!isMyTurnFree(S,seat)) return 'Not now';
  if(S.phase!=='combat') return 'Combat phase';
  if((P.st.used||[]).includes(ai)) return 'Already used this combat';
  if(!canPay(P,a.cost)) return 'Not enough';
  if(a.needCore && !P.cores.length) return 'You need a core';
  return null;
}
function negateOptions(S,seat){
  const P=S.p[seat], out=[];
  P.hand.forEach((id,hi)=>{ const c=CARDLIST[id]; if(NEGATORS.has(c.name) && canPay(P,c.cost)) out.push({kind:'card',hi,label:c.name,cost:c.cost}); });
  return out;
}

/* ---------- Saving + undo ---------- */
const stripUndo = s => { const c=clone(s); c.undo=null; return c; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function commit(T){
  const base = actionBefore ? actionBefore.ver : (S?S.ver:0);
  T.ver=(S&&S.ver||T.ver||0)+1; T.updatedAt=Date.now();
  if(T.undo) T.undo.ver=T.ver;
  S=T; render();
  if(T.mode==='online' && gameRef){
    const snap=clone(T);
    writeChain = writeChain.then(async()=>{
      try{
        let got=false;
        for(let i=0;i<8 && !got;i++){ const l=await gameRef.acquire({holder:myId, ttlMs:1000}); got=l.acquired; if(!got) await sleep(250); }
        if(!got) throw {code:'busy'};
        const cur=await gameRef.get();
        if(cur.exists && (cur.data().ver||0)!==base) throw {code:'conflict', data:cur.data()};
        await gameRef.set(snap);
      }catch(e){
        if(e && (e.code==='conflict'||e.code==='busy')){ toast('The other player acted at the same moment, so your move was cancelled. Try again.'); if(e.data){ S=clone(e.data); render(); } }
        else toast('Could not save your move: '+(e&&e.code||'error')+'. Try again.');
      }
    });
    await writeChain;
  }
}
/* commit a player action; undoable unless it rolled dice or drew cards */
async function commitA(T, seat, label){
  T.undo = (label && !rolledFlag && actionBefore) ? {by:seat, label, prev:stripUndo(actionBefore)} : null;
  await commit(T);
}
function canUndo(){
  return S && S.undo && S.undo.ver===S.ver && canAct(S.undo.by) && S.status==='playing';
}
async function doUndo(){
  await guard(async()=>{
    if(!canUndo()) return;
    const u=S.undo, T=clone(u.prev);
    T.undo=null; lg(T,`{${u.by}} undoes: ${u.label}.`);
    closeModal();
    await commit(T);
  });
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),3200); }

/* ---------- Modal pickers ---------- */
let modalResolve=null, promptVer=null;
function openModal(html){ const m=$('#modal'); m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}</div>`; m.classList.add('on'); return m; }
function hideModal(){ const m=$('#modal'); m.classList.remove('on'); m.innerHTML=''; m.onclick=null; }
function closeModal(){ hideModal(); if(modalResolve){ const r=modalResolve; modalResolve=null; r(null); } }
function finish(res,v){ modalResolve=null; hideModal(); res(v); }
async function askConfirm(title, sub, yes='Yes'){
  const r=await pickOne(esc(title), [{v:'yes', html:`<span class="eb danger">${esc(yes)}</span>`},{v:'no',label:'Cancel'}], {cancel:false, sub:esc(sub||'')});
  return r==='yes';
}
function pickOne(title, opts, {cancel=true, sub=''}={}){
  return new Promise(res=>{
    modalResolve=res;
    const m=openModal(`<h3>${title}</h3>${sub?`<p class="msub">${sub}</p>`:''}<div class="mopts">${opts.map((o,i)=>`<button type="button" class="mopt" data-i="${i}" ${o.disabled?'disabled':''}>${o.html||esc(o.label)}</button>`).join('')}</div>${cancel?'<div class="mfoot"><button type="button" class="btn ghost" data-x>Cancel</button></div>':''}`);
    m.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; if(b.hasAttribute('data-x')){ finish(res,null); return; } if(b.dataset.i!=null) finish(res,opts[+b.dataset.i].v); };
  });
}
function pickMulti(title, opts, {min=0,max=1,sub='',repeat=false,confirm='Confirm'}={}){
  return new Promise(res=>{
    modalResolve=res;
    let sel=[];
    const draw=()=>{
      const m=openModal(`<h3>${title}</h3>${sub?`<p class="msub">${sub}</p>`:''}
        <div class="mopts">${opts.map((o,i)=>{ const c=sel.filter(x=>x===i).length; return `<button type="button" class="mopt ${c?'sel':''}" data-i="${i}" ${o.disabled?'disabled':''}>${o.html||esc(o.label)}${c>1?` <span class="cnt">×${c}</span>`:''}</button>`; }).join('')}</div>
        <p class="msub">${sel.length} of ${max} chosen${min?` (at least ${min})`:''}</p>
        <div class="mfoot"><button type="button" class="btn ghost" data-x>Cancel</button><button type="button" class="btn" data-ok ${sel.length<min?'disabled':''}>${confirm}</button></div>`);
      m.onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
        if(b.hasAttribute('data-x')){ finish(res,null); return; }
        if(b.hasAttribute('data-ok')){ finish(res,sel.map(i=>opts[i].v)); return; }
        const i=+b.dataset.i, o=opts[i];
        const cnt=sel.filter(x=>x===i).length;
        if(repeat){ if(sel.length<max && cnt<(o.limit||99)) sel.push(i); else if(cnt){ sel.splice(sel.lastIndexOf(i),1); } }
        else { if(cnt) sel=sel.filter(x=>x!==i); else if(sel.length<max) sel.push(i); else if(max===1) sel=[i]; }
        draw();
      };
    };
    draw();
  });
}
const elBtn = (k,extra='') => `<span class="eb">${k==='A'?wildPip():pip(k)}<span>${k==='A'?'Wild':EL_NAME[k]}${extra}</span></span>`;
function wildPip(){

/* Gather the choices an ability or card needs, before committing */
async function gather(seat, fx, {needTarget=true}={}){
  const P=S.p[seat], E=S.p[1-seat], ctx={};

      case 'unfreezeOne': { const r=await pickDice('Unfreeze which die?', seat, d=>d.fz, 1, 1); if(!r||!r.length) return null; ctx.die=r[0]; break; }
      case 'forgeOpt': { if(!P.cores.length) break; const r=await pickOne('Deal 1 damage to one of your cores for +2 damage?', [{v:'no',label:'No thanks'}].concat(P.cores.map((c,i)=>({v:'c'+i, html:`<span class="tgt">${esc(CARDLIST[c.id].name)}<small>Core · ${c.hp} health</small></span>`})))); if(!r) return null; if(r!=='no') ctx.forge=+r.slice(1); break; }
      case 'selfCoreDmg': case 'scrap': { const r=await pickOne(op[0]==='scrap'?'Scrap which core?':'Which of your cores takes the damage?', P.cores.map((c,i)=>({v:'c'+i, html:`<span class="tgt">${esc(CARDLIST[c.id].name)}<small>Core · ${c.hp} health</small></span>`}))); if(!r) return null; ctx.ownCore=+r.slice(1); break; }
      case 'healCore': { if(!P.cores.length) break; const r=await pickOne('Heal which of your cores?', P.cores.map((c,i)=>({v:'c'+i, html:`<span class="tgt">${esc(CARDLIST[c.id].name)}<small>${c.hp} / ${c.max||CARDLIST[c.id].hp} health</small></span>`}))); if(!r) return null; ctx.healCore=+r.slice(1); break; }
      case 'reforge': { const list=[...new Set(P.disc.filter(i=>isCoreCard(CARDLIST[i])))]; const r=await pickOne('Reforge which core?', list.map(i=>({v:'d'+i,label:CARDLIST[i].name}))); if(!r) return null; ctx.discCore=+r.slice(1); break; }
      case 'emberOpt': { if(!P.dice.some(d=>d.fz)) break; const r=await pickDice('Unfreeze a die for +1 damage? (optional)', seat, d=>d.fz, 0, 1); if(r===null) return null; if(r.length) ctx.ember=r[0]; break; }
      case 'reroll': case 'flip': { const r=await pickDice(`${op[0]==='reroll'?'Reroll':'Flip'} up to ${op[1]} of your dice`, seat, d=>!d.fz&&!d.fzE, 1, op[1]); if(!r) return null; ctx.dice=r; break; }
      case 'setDie': {
        const r=await pickDice('Set which die?', seat, d=>!d.fz&&!d.fzE, 1, 1); if(!r||!r.length) return null; ctx.dice=r;
        const H=heroEl(S,seat);
        const f=await pickOne('Turn it to which face?', [1,2,3,4,5].map(f=>({v:f, html:f===5?elBtn('A'):elBtn(f===4?H:FACE_LABEL[f])})));
        if(!f) return null; ctx.face=f; break;
      }
      case 'protectCore': { const r=await pickOne('Protect which core?', P.cores.map((c,i)=>({v:i+1, label:`${CARDLIST[c.id].name} (${c.hp})`}))); if(!r) return null; ctx.core=r-1; break; }
      case 'discard': { const r=await pickOne('Discard which card?', P.hand.map((id,hi)=>({v:hi+1,label:CARDLIST[id].name})).filter(o=>o.v-1!==gather._playing)); if(!r) return null; ctx.discard=[r-1]; break; }
      case 'dmgX': if(op[1]==='xpaid'){ const max=P.res.L||0; if(max===0){ ctx.x=0; break; } const r=await pickOne('Spend how much Lightning (X)?', Array.from({length:max},(_,i)=>({v:i+1,label:String(i+1)}))); if(!r) return null; ctx.x=r; } break;
    }
  }
  return ctx;
}

/* ---------- Player actions ---------- */
async function guard(fn){
  if(busy) return; busy=true; rolledFlag=false; actionBefore=S;
  try{ await fn(); } finally{ busy=false; setTimeout(maybePrompt,60); }
}
function boardChanged(v0){ if(S && S.ver!==v0){ closeModal(); toast('The board changed while you were choosing (your opponent acted). Please make your choice again.'); return true; } return false; }
async function chooseWilds(seat){
  // returns an assign map with every wild die decided, or null if cancelled
  const P=S.p[seat], assign={...(P.assign||{})};
  for(let i=0;i<P.dice.length;i++){
    const d=P.dice[i];
    if(!isWildFace(d) || assign[i] || (S.heroes[seat]==='ice' && d.fz)) continue;
    const k=await pickOne(`Wild die ${i+1}: what should it become?`, dieOptions(S,seat,i).map(k=>({v:k,html:elBtn(k)})), {sub:'Wild sides (5 and 6) can be any of your elements.'});
    if(!k) return null; playSfx('tch'); assign[i]=k;
  }
  return assign;
}
const act = {
  roll: ()=>guard(async()=>{ const T=clone(S); doRoll(T); await commitA(T,S.turn,null); }),
  collect: ()=>guard(async()=>{
    const seat=S.turn, v0=S.ver, assign=await chooseWilds(seat); if(!assign || boardChanged(v0)) return;
    const T=clone(S); T.p[seat].assign=assign; doCollect(T); await commitA(T,seat,'collect resources');
  }),
  next: ()=>guard(async()=>{ const T=clone(S); const was=PHASE_NAME[T.phase]; nextPhase(T); await commitA(T,S.turn, T.turn!==S.turn?'end turn':`leave ${was}`); }),
  assign: (i)=>guard(async()=>{
    const seat=S.turn, opts=dieOptions(S,seat,i); if(opts.length<2) return;
    const k=await pickOne(`Die ${i+1}: what should it count as?`, opts.map(k=>({v:k,html:elBtn(k)})), {sub: isWildFace(S.p[seat].dice[i])?'Wild side: pick any of your elements.':'Frozen die: ice or the element it shows.'});
    if(!k) return;
    playSfx('tch'); const T=clone(S); T.p[seat].assign={...T.p[seat].assign,[i]:k}; await commitA(T,seat,'choose a die');
  }),
  ability: (ai)=>guard(async()=>{
    const seat=S.turn, a=ABIL[S.heroes[seat]][ai];
    if(abilBlockReason(S,seat,ai)) return;
    const v0=S.ver; const ctx=await gather(seat,a.fx); if(!ctx || boardChanged(v0)) return; ctx.fire=a.cost.includes('F');
    const T=clone(S); pay(T.p[seat],a.cost); T.p[seat].st.used=[...(T.p[seat].st.used||[]),ai]; lg(T,`{${seat}} uses ${a.n}.`);
    T.q.unshift(...expand(T,seat,a.fx,ctx,a.el,a.n)); advance(T); await commitA(T,seat,a.n);
    const fc=S.p[seat].freeCard; if(fc!=null && a.fx.some(o=>o[0]==='eclipse')){ setTimeout(()=>{ const hi=S.p[seat].hand.lastIndexOf(fc); if(hi>=0 && !cardBlockReason(S,seat,hi)) act.play(hi,seat); else toast(`${CARDLIST[fc].name} can’t be played right now, so it stays in your hand.`); },700); }
  }),
  play: (hi, seatArg)=>guard(async()=>{
    const seat=seatArg!=null?seatArg:S.turn, P=S.p[seat], id=P.hand[hi], c=CARDLIST[id];
    if(cardBlockReason(S,seat,hi)) return;

    lg(T,`{${seat}} plays ${c.name}${free?' for free':''}.`); sfx(T, c.type==='Instant' ? 'instant' : 'card');
    let steps;
    if(isCoreCard(c)) steps=[{k:'op',seat,op:['placeCore'],ctx:{id},el:null,src:c.name}];
    else { TP.disc.push(id); steps=expand(T,seat,fx,ctx,cardEl(c),c.name); if(c.type==='Instant') steps.push({k:'ping',seat}); }
    if(negateOptions(T,1-seat).length) T.q.unshift({k:'respond', actor:1-seat, card:id, seat, steps});
    else T.q.unshift(...steps);

  }),
  cool: ()=>guard(async()=>{

    const hi=await pickOne('Discard a card for its resources', opts, {sub:'You gain every resource on the card except the left-most one.'}); if(!hi) return;
    const id=P.hand[hi-1], val=discardValue(CARDLIST[id]), gains=[];

      else gains.push(k);
    }
    if(boardChanged(v0)) return;
    const T=clone(S), TP=T.p[seat]; TP.hand.splice(hi-1,1); TP.disc.push(id);
    gains.forEach(k=>{ if(TP.res[k]!==undefined) addRes(TP,k,1); });
    lg(T,`{${seat}} discards ${CARDLIST[id].name} for ${gains.map(k=>EL_NAME[k]).join(', ')}.`); await commitA(T,seat,'discard for resources');
  }),
  fogClear: (fi)=>guard(async()=>{

    const T=clone(S), TP=T.p[seat]; TP.res[r[0]]--; const k=TP.fogPend.splice(fi,1)[0]; addRes(TP,k,1);

  energy: ()=>guard(async()=>{

    const from=await pickOne('Energy Core: change which resource?', Object.keys(P.res).map(k=>({v:k,html:elBtn(k,` · ${P.res[k]}`),disabled:P.res[k]<=0}))); if(!from) return;
    const to=await pickOne('…into which element?', Object.keys(P.res).filter(k=>k!==from).map(k=>({v:k,html:elBtn(k)}))); if(!to) return;
    const T=clone(S), TP=T.p[seat]; TP.res[from]--; addRes(TP,to,1); TP.st.energy=1; lg(T,`{${seat}} converts ${EL_NAME[from]} into ${EL_NAME[to]}.`); await commitA(T,seat,'Energy Core');
  }),
  rime: ()=>guard(async()=>{
    const seat=S.turn; const r=await pickDice('Rime Core: freeze 1 die (free)', seat, d=>!d.fz, 1, 1); if(!r||!r.length) return;
    const T=clone(S); T.p[seat].dice[r[0]].fz=1; T.p[seat].st.rime=1; lg(T,`Rime Core freezes one of {${seat}}'s dice.`); await commitA(T,seat,'Rime Core');
  }),
  tesla: ()=>guard(async()=>{
    const seat=S.turn; if((S.p[seat].res.L||0)<1) return;
    const v0=S.ver; const t=await pickTarget(seat); if(!t || boardChanged(v0)) return;
    const T=clone(S); T.p[seat].res.L--; lg(T,`{${seat}} fires the Tesla Coil.`);
    T.q.unshift({k:'packet',from:seat,unb:0,blk:2,el:'L',src:'Tesla Coil',tgt:t}); advance(T); await commitA(T,seat,'Tesla Coil');
  }),
  adjust: (field,delta,k)=>guard(async()=>{
    const seat=viewSeat(); if(!canAct(seat)) return;
    const T=clone(S), P=T.p[seat];
    if(field==='hp') P.hp=Math.max(0,P.hp+delta); else if(field==='shield') P.shield=Math.max(0,P.shield+delta); else if(field==='res') P.res[k]=Math.max(0,Math.min(MAXRES,P.res[k]+delta));
    lg(T,`{${seat}} adjusts ${field==='res'?EL_NAME[k]:field} by ${delta>0?'+':''}${delta} (manual fix).`); checkWin(T); await commitA(T,seat,'manual fix');
  }),
  concede: ()=>guard(async()=>{
    const seat=viewSeat(); if(!(await askConfirm('Concede this game?','Your opponent wins.','Concede'))) return;
    const T=clone(S); T.status='over'; T.winner=1-seat; T.q=[]; lg(T,`{${seat}} concedes.`); await commitA(T,seat,null);

/* place a core (handled here so cores also go through the respond window) */
const _runOp = runOp;
runOp = function(S,st){ if(st.op[0]==='placeCore'){ const P=S.p[st.seat]; if(P.cores.length<maxCores(S,st.seat)){ P.cores.push({id:st.ctx.id,hp:CARDLIST[st.ctx.id].hp,prot:0,max:CARDLIST[st.ctx.id].hp}); lg(S,`{${st.seat}} sets down ${CARDLIST[st.ctx.id].name}.`);} else P.disc.push(st.ctx.id); return; } return _runOp(S,st); };

/* ---------- Answering prompts (defend / respond / lose / hex / seal) ---------- */
async function answerPrompt(){
  const pi=pendingInput(S); if(!pi || !canAct(pi.actor)) return;
  await guard(async()=>{
    const seat=pi.actor, ver0=S.ver;
    promptVer=ver0;
    const stale = ()=>{ if(S.ver!==ver0 || !pendingInput(S)){ return true; } return false; };
    try{
    if(pi.k==='defend'){
      const pk=pi.pk;
      const r = await defendDialog(seat, pk); if(!r || stale()) return;
      const T=clone(S); applyDefend(T,seat,r);
      await commitA(T,seat,null); return;
    }
    if(pi.k==='respond'){
      const opts=negateOptions(S,seat), c=CARDLIST[pi.card];
      const choice=await pickOne(`${esc(seatLabel(pi.seat))} plays ${esc(c.name)}`, [{v:'allow',label:'Let it happen'}].concat(opts.map((o,i)=>({v:'n'+i, html:`<span class="eb">Negate with ${esc(o.label)} <span class="mcost">${o.cost.map(pip).join('')}</span></span>`}))), {cancel:false, sub:esc(c.text.replace(/\{.\}/g,''))});
      if(!choice || stale()) return;
      const T=clone(S), st=T.q.shift(), TP=T.p[seat];
      if(choice==='allow'){ T.q.unshift(...st.steps); }
      else { const o=opts[+choice.slice(1)];
        if(o.kind==='card'){ const id=TP.hand[o.hi]; pay(TP,CARDLIST[id].cost); TP.hand.splice(o.hi,1); TP.disc.push(id); staticFieldPing(T,seat); }
        else pay(TP,ABIL.dark[7].cost);
        lg(T,`{${seat}} negates ${CARDLIST[st.card].name} with ${o.label}!`); flash(T,`🚫 ${CARDLIST[st.card].name} was negated!`); sfx(T,'instant');
        if(isCoreCard(CARDLIST[st.card])) T.p[st.seat].disc.push(st.card);
      }
      advance(T); await commitA(T,seat,null); return;
    }
    if(pi.k==='lose'){
      const r=await pickRes(`Choose ${pi.n} resource to lose`, seat, pi.n); if(r===null || stale()) return;
      const T=clone(S); T.q.shift(); r.forEach(k=>{ if(T.p[seat].res[k]>0) T.p[seat].res[k]--; }); lg(T,`{${seat}} loses ${r.map(k=>EL_NAME[k]).join(', ')}.`); advance(T); await commitA(T,seat,null); return;
    }
    if(pi.k==='hex'){
      const tgt=1-seat; const r=await pickDice(`Roll Hex: choose ${pi.n} enemy die to reroll`, tgt, d=>!d.fz&&!d.fzE, pi.n, pi.n); if(r===null || stale()) return;
      const T=clone(S); T.q.shift(); r.forEach(i=>{ T.p[tgt].dice[i].f=1+rnd(6); }); bumpRoll(T.p[tgt],r); lg(T,`{${seat}}'s hex forces a reroll.`); advance(T); await commitA(T,seat,null); return;
    }
    if(pi.k==='seal'){
      const tgt=1-seat;
      const yes=await pickOne('Use Roll Seal?', [{v:'no',label:'Not now'},{v:'yes',html:`<span class="eb">Use Roll Seal <span class="mcost">${ABIL.dark[5].cost.map(pip).join('')}</span></span>`}], {cancel:false, sub:'Choose 2 of their dice to reroll.'});
      if(!yes || stale()) return;
      if(yes==='no'){ const T=clone(S); T.q.shift(); advance(T); await commitA(T,seat,null); return; }
      const r=await pickDice('Choose 2 enemy dice to reroll', tgt, d=>!d.fz&&!d.fzE, 1, 2); if(!r || stale()) return;
      const T=clone(S); T.q.shift(); pay(T.p[seat],ABIL.dark[5].cost); r.forEach(i=>{ T.p[tgt].dice[i].f=1+rnd(6); }); bumpRoll(T.p[tgt],r); lg(T,`{${seat}} uses Roll Seal: {${tgt}} rerolls ${r.length} dice.`); advance(T); await commitA(T,seat,null); return;
    }
    } finally { promptVer=null; }
  });
}
function applyDefend(T,seat,r){
  const TP=T.p[seat], st=T.q.shift(), npk=st.pk;
      let blocked=0;
      r.blocks.forEach(k=>{ if(TP.res[k]>0){ TP.res[k]--; blocked += beats(k,npk.el)?2:1; } });
      if(r.blocks.length) sfx(T,'block');
      if(r.blocks.length) lg(T,`{${seat}} blocks ${blocked} with ${r.blocks.map(k=>EL_NAME[k]).join(' + ')}.`);
      if(r.card!=null){
        const id=TP.hand[r.card], c=CARDLIST[id]; pay(TP,c.cost); TP.hand.splice(r.card,1); TP.disc.push(id);
        lg(T,`{${seat}} plays ${c.name}!`); sfx(T,'instant');
        if(c.name==='Defensive Shield') blocked+=4;
        if(c.name==='Shadow Step'){ npk.blk=0; npk.unb=0; drainFrom(T,seat,autoDrainEls(T,seat,1),0); }
        if(c.name==='Ice Wall'){ const n=3+(TP.dice.some(d=>d.fz)?1:0); TP.shield+=n; lg(T,`{${seat}} gains ${n} shield.`); }
        if(c.name==='Mirror Veil'){ TP.st.reflN+=2; }
        staticFieldPing(T,seat);
      }
      npk.blocked=blocked; npk.done=1;
      if(r.redirect){ const ci=TP.cores.findIndex(c=>CARDLIST[c.id].name==='Water Stone'); if(ci>=0){ lg(T,`Water Stone takes the hit.`); damageCore(T,seat,ci,npk.unb+Math.max(0,npk.blk-blocked),npk.src,npk.from); npk.blk=0; npk.unb=0; } }
  T.q.unshift(npk); advance(T);
}
function defendDialog(seat, pk){
  return new Promise(res=>{
    modalResolve=res;
    const P=S.p[seat];
    let blocks=[], card=null, redirect=false;
    const cards=P.hand.map((id,hi)=>({id,hi,c:CARDLIST[id]})).filter(x=>DEFEND_OK.has(x.c.name) && canPay(P,x.c.cost));
    const hasWS=hasCore(P,'Water Stone');
    const draw=()=>{
      const left={...P.res}; blocks.forEach(k=>left[k]--);
      let bv=blocks.reduce((a,k)=>a+(beats(k,pk.el)?2:1),0);
      if(card!=null && CARDLIST[P.hand[card]].name==='Defensive Shield') bv+=4;
      const prevented = card!=null && CARDLIST[P.hand[card]].name==='Shadow Step';
      const raw = redirect||prevented ? 0 : pk.unb + Math.max(0, pk.blk - bv);
      const glac = hasCore(P,'Glacier Core') ? P.dice.filter(d=>d.fz).length : 0;
      const bulw = hasCore(P,'Earthen Bulwark') && !P.st.bulwark ? 1 : 0;
      const afterCores = Math.max(0, raw - glac - bulw);
      const through = Math.max(0, afterCores - P.shield);
      const coreNotes = [];
      if(hasCore(P,'Earthen Bulwark')) coreNotes.push(P.st.bulwark ? '🛡 Earthen Bulwark: already used this round' : '🛡 Earthen Bulwark will block 1 (once per round)');
      if(glac) coreNotes.push(`🛡 Glacier Core will block ${glac}`);
      if(P.shield) coreNotes.push(`🛡 Your shield soaks ${Math.min(P.shield,afterCores)}`);
      const m=openModal(`<h3>Defend!</h3>
        <p class="msub">${esc(seatLabel(pk.from))}'s <b>${esc(pk.src)}</b> deals ${pk.blk} ${EL_NAME[pk.el]||''} damage${pk.unb?` + ${pk.unb} unblockable`:''}.</p>
        <div class="myres"><span class="mlbl">You have</span>${Object.keys(P.res).map(k=>`<span class="rchip">${pip(k)}<b>${left[k]}</b></span>`).join('')}<span class="rtotal">Total ${Object.values(left).reduce((a,b)=>a+b,0)}</span></div>
        <p class="mlbl">Spend up to 2 resources (each blocks 1, or 2 if it beats ${EL_NAME[pk.el]||'the attack'}):</p>
        <div class="mopts">${Object.keys(P.res).map(k=>`<button type="button" class="mopt" data-res="${k}" ${left[k]<=0||blocks.length>=2?'disabled':''}>${elBtn(k,` · ${P.res[k]}${beats(k,pk.el)?' · blocks 2':''}`)}</button>`).join('')}</div>
        ${blocks.length?`<div class="blocking"><span class="mlbl">Blocking with</span>${blocks.map(k=>`<span class="rchip">${pip(k)}${beats(k,pk.el)?'<b>2</b>':'<b>1</b>'}</span>`).join('')}<button type="button" class="clearbtn" data-clr>✕ Clear</button></div>`:''}
        ${cards.length?`<p class="mlbl">Or play a defense card:</p><div class="mopts">${cards.map(x=>`<button type="button" class="mopt ${card===x.hi?'sel':''}" data-card="${x.hi}"><span class="eb">${esc(x.c.name)} <span class="mcost">${x.c.cost.map(pip).join('')}</span></span></button>`).join('')}</div>`:''}
        ${hasWS?`<label class="chk"><input type="checkbox" data-ws ${redirect?'checked':''}> Redirect the hit to Water Stone</label>`:''}
        ${coreNotes.length?`<div class="coredef"><span class="mlbl">Automatic defense</span>${coreNotes.map(t=>`<span class="cdchip">${esc(t)}</span>`).join('')}</div>`:''}
        <p class="mres">You will take <b>${through}</b> damage${raw!==through?` (${raw} before automatic defense)`:''}.</p>
        <div class="mfoot"><button type="button" class="btn" data-ok>Confirm</button></div>`);
      m.onclick=e=>{
        const b=e.target.closest('button,input'); if(!b) return;
        if(b.dataset.res){ blocks.push(b.dataset.res); draw(); }
        else if(b.hasAttribute('data-clr')){ blocks=[]; draw(); }
        else if(b.dataset.card!=null){ const hi=+b.dataset.card; card = card===hi?null:hi; draw(); }
        else if(b.hasAttribute('data-ws')){ redirect=b.checked; draw(); }
        else if(b.hasAttribute('data-ok')){ finish(res,{blocks,card,redirect}); }
      };
    };
    draw();
  });
}

function playerPanel(S,seat,mine){

function wheelSVG(hk){

  // outer wheel: arcs between the three shared elements
  const arc=(a,b)=>{ const d=18, a1=(ang[a]+d)*Math.PI/180, a2=(ang[b]-d)*Math.PI/180;
    const x1=C+R*Math.cos(a1), y1=C+R*Math.sin(a1), x2=C+R*Math.cos(a2), y2=C+R*Math.sin(a2);
    return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="#1a1030" stroke-width="9" stroke-linecap="round"/>
            <path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${COL[a]}" stroke-width="5.5" stroke-linecap="round" marker-end="url(#wa-${a})"/>`; };
  const outer=[['F','E'],['E','W'],['W','F']].filter(([a,b])=>BEATS.some(([x,y])=>x===a&&y===b)).map(([a,b])=>arc(a,b)).join('');
  // center links for the unique element
  const inWheel=k=>['F','E','W',U].includes(k);
  const links=!U?'':BEATS.filter(([a,b])=>(a===U||b===U) && inWheel(a) && inWheel(b)).map(([a,b])=>{
    const [x1,y1]=pos(a), [x2,y2]=pos(b), dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    const sx=x1+ux*(NR+4), sy=y1+uy*(NR+4), ex=x2-ux*(NR+9), ey=y2-uy*(NR+9);
    return `<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#1a1030" stroke-width="9" stroke-linecap="round"/>
            <line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${COL[a]}" stroke-width="5.5" stroke-linecap="round" marker-end="url(#wa-${a})"/>`;
  }).join('');
  const node=(k)=>{ const [x,y]=pos(k), s=NR*1.15;
    const ly = k==='F' ? y-NR-9 : y+NR+17;
    const lbl = k===U ? '' : `<text x="${x}" y="${ly.toFixed(1)}" class="wl">${EL_NAME[k]}</text>`;
    return `<g><circle cx="${x}" cy="${y}" r="${NR+4}" fill="#1a1030"/><circle cx="${x}" cy="${y}" r="${NR}" fill="${COL[k]}" stroke="#fff" stroke-width="3"/>
      <g class="wg" transform="translate(${x-s/2} ${y-s/2}) scale(${s/100})">${ICONS[EL[k]]}</g>${lbl}</g>`; };
  const neutral=!BEATS.some(([a,b])=>a===U||b===U);
  return `<svg class="wheel" viewBox="0 -6 300 312" role="img" aria-label="Element wheel: fire beats nature, nature beats water, water beats fire.${U?' '+EL_NAME[U]+' in the middle.':''}">
    <defs>${markers}</defs>

    ${outer}${links}${node('F')}${node('E')}${node('W')}${U?node(U):''}
    ${U?`<text x="${C}" y="${C+NR+19}" class="wl wlu">${EL_NAME[U]}${neutral?' (neutral)':''}</text>`:''}
  </svg>`;
}

      case 'discard': { const opts=P.hand.map((id,i)=>i).filter(i=>i!==playingHi); if(!opts.length) return null; ctx.discard=[opts[0]]; break; }
      case 'dmgX': if(op[1]==='xpaid') ctx.x=P.res.L||0; break;
      case 'forgeOpt': { const i=P.cores.findIndex(c=>c.hp>=3); if(i>=0) ctx.forge=i; break; }
